name: Integration memory measurement (KIT-150)

# Run-only lane (branch run-mofa-measure-k150; KIT-150 revision 1.1 and the decisions of 2026-11-21): peak memory and
# time of the MOFA2 integration module per stage, at fixed study sizes, for five package commits installed side by
# side in one job (each in its own library over the KIT-134 snapshot library), every stage in a fresh R process inside
# its own memory cgroup. Copied from the MOFA2 package lane (run-mofa-smoke-k152, .github/workflows/mofa-package.yml):
# the same R 4.6.1, snapshot library (MultiScholaR at build C installed there by the action), MOFA2 closure and the
# bundle's Python, started through the bundle's launcher.
# Declaration: docs/qa/workflow-execution/kit/kit-150/declaration.md (committed before any run).
#
# Start: change .github/mofa-smoke/k150-params.json in a commit and push it to run-mofa-measure-k150.
#   label    short name of the run
#   attempt  lifecycle | probe | counted | correction (as the declaration counts attempts)
#   jobs     [{name, plan, size, timeout}]: plan lifecycle | probe | counted-small | counted-large (k150-plan.sh);
#            size S | M | L | Lp; timeout in minutes (at most 330)
# Token rules (as the package lane): the token goes only to the library action; no cache of any kind; nothing built
# with it and no install or build output is uploaded (only the measurement records, scanned first).

on:
  push:
    branches:
      - "run-kit209-integration"
    paths:
      - .github/mofa-smoke/k150-params.json
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: k209-integration-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    name: Parameters
    runs-on: ubuntu-latest
    outputs:
      jobs: ${{ steps.plan.outputs.jobs }}
      library_commit: ${{ steps.plan.outputs.library_commit }}
      install_builds: ${{ steps.plan.outputs.install_builds }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/mofa-smoke
          persist-credentials: false
      - id: plan
        run: |
          p=.github/mofa-smoke/k150-params.json
          jq -e '(.label | type == "string" and test("^[A-Za-z0-9][A-Za-z0-9-]{0,40}$")) and
            (.attempt | IN("lifecycle", "probe", "counted", "correction", "g0i", "instrument")) and
            (.jobs | type == "array" and length >= 1 and length <= 4 and
              all(.name | type == "string" and test("^[A-Za-z0-9][A-Za-z0-9-]{0,30}$")) and
              all(.plan | IN("lifecycle", "probe", "counted-small", "counted-large", "g0i")) and
              all(.size | IN("S", "M", "L", "Lp")) and
              all(.timeout | type == "number" and . == floor and . >= 20 and . <= 330))' "$p" > /dev/null \
            || { echo "::error::k150-params.json is not valid"; exit 1; }
          echo "jobs=$(jq -c .jobs "$p")" | tee -a "$GITHUB_OUTPUT"
          c=$(awk -F'\t' -v lib="$(jq -r '.library_build // "C"' "$p")" '$1 == lib { print $2 }' .github/mofa-smoke/k150-builds.tsv)
          [[ "$c" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::build C has no commit"; exit 1; }
          echo "library_commit=$c" | tee -a "$GITHUB_OUTPUT"
          echo "install_builds=$(jq -r '.install_builds // ""' "$p")" | tee -a "$GITHUB_OUTPUT"

  measure:
    name: ${{ matrix.job.name }} (${{ matrix.job.plan }}, ${{ matrix.job.size }})
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        job: ${{ fromJSON(needs.plan.outputs.jobs) }}
    runs-on: ubuntu-22.04
    timeout-minutes: ${{ matrix.job.timeout }}
    steps:
      - name: Job start
        run: echo "JOB_STARTED=$(date +%s)" | tee -a "$GITHUB_ENV"

      - name: The library's package (build C; the snapshot library installs it)
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.library_commit }}
          persist-credentials: false
          lfs: false

      - name: This lane's scripts
        uses: actions/checkout@v4
        with:
          path: lane
          persist-credentials: false

      - name: Versions from the distributable workflow; paths; the runner
        run: |
          for key in R_VERSION PBS_RELEASE PBS_PYTHON; do
            value="$(sed -n "s/^  $key: \"\(.*\)\"$/\1/p" lane/.github/workflows/distributable.yml)"
            test -n "$value" || { echo "::error::$key not found in distributable.yml"; exit 1; }
            echo "$key=$value" | tee -a "$GITHUB_ENV"
          done
          {
            echo "BUNDLE=$RUNNER_TEMP/bundle"
            echo "OUT=$RUNNER_TEMP/evidence"
            echo "RES=$RUNNER_TEMP/result"
            echo "LIBROOT=$RUNNER_TEMP/builds"
          } >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/evidence" "$RUNNER_TEMP/result" "$RUNNER_TEMP/builds"
          {
            echo "image: ${ImageOS:-?} ${ImageVersion:-?}"
            uname -r
            nproc
            grep -E '^(MemTotal|SwapTotal)' /proc/meminfo
            lscpu | grep -E '^(Model name|CPU\(s\)|Thread|Core)'
            df -h "$RUNNER_TEMP" /
            echo "cgroup: $(stat -fc %T /sys/fs/cgroup) controllers: $(cat /sys/fs/cgroup/cgroup.subtree_control 2> /dev/null)"
          } | tee "$RUNNER_TEMP/result/runner.txt"

      - name: R 4.6.1, the KIT-134 library, the internal packages and MultiScholaR at build C (no cache)
        uses: ./.github/actions/snapshot-library
        with:
          token: ${{ secrets.DEPS_READ_TOKEN }}
          extra-packages: ""

      - name: MOFA2's closure from the snapshot (plan, system libraries, install; versions against the bundle's)
        run: |
          set -o pipefail
          R_LIBS="$MSR_TOOLS_LIB" /opt/R/4.6.1/bin/Rscript --vanilla lane/.github/mofa-smoke/install-mofa-library.R plan lane "$OUT"
          (cd lane && bash packaging/linux/build.sh sysreqs)
          R_LIBS="$MSR_TOOLS_LIB" /opt/R/4.6.1/bin/Rscript --vanilla lane/.github/mofa-smoke/install-mofa-library.R install lane "$OUT" \
            2>&1 | tee "$OUT/install-mofa-library.log" | { grep -vE '^(\* |trying URL|Content type|downloaded|=+$)' || true; } | tail -n 40
          cp "$OUT/mofa-library-versions.tsv" "$RES/"

      - name: The bundle's Python (packaging/linux/build.sh python; hashes checked)
        run: |
          (cd lane && bash packaging/linux/build.sh python)
          cp "$OUT/python-packages.txt" "$RES/"
          "$BUNDLE/python/bin/python3" --version | tee "$RES/python-version.txt"

      - name: Bundle-shaped folder for the launcher (bin/Rscript = packaging/linux/Rscript, R -> the R home)
        run: |
          mkdir -p "$BUNDLE/bin"
          install -m 0755 lane/packaging/linux/Rscript "$BUNDLE/bin/Rscript"
          ln -s "/opt/R/$R_VERSION/lib/R" "$BUNDLE/R"

      - name: The five builds, each in its own library (R CMD INSTALL of each commit; logs kept on the runner)
        env:
          GIT_LFS_SKIP_SMUDGE: "1"
          INSTALL_BUILDS: ${{ needs.plan.outputs.install_builds }}
        run: |
          set -o pipefail
          logs="$RUNNER_TEMP/build-logs"
          mkdir -p "$logs" "$RUNNER_TEMP/src"
          while IFS=$'\t' read -r build commit variant; do
            [ "$build" = build ] && continue
            # KIT-209 G0i: only the builds the params name (all when none are named).
            case " ${INSTALL_BUILDS:-$build} " in *" $build "*) ;; *) continue ;; esac
            src="$RUNNER_TEMP/src/$build"
            mkdir -p "$src" "$LIBROOT/$build"
            git -C "$src" init -q
            git -C "$src" fetch -q --depth 1 "https://github.com/$GITHUB_REPOSITORY" "$commit" < /dev/null
            git -C "$src" checkout -q FETCH_HEAD
            test "$(git -C "$src" rev-parse HEAD)" = "$commit" || { echo "::error::$build is not at $commit"; exit 1; }
            ( /opt/R/4.6.1/bin/R CMD INSTALL --no-test-load --library="$LIBROOT/$build" "$src" > "$logs/$build.log" 2>&1
              echo $? > "$logs/$build.status" ) &
            # At most three installs at a time.
            while [ "$(jobs -rp | wc -l)" -ge 3 ]; do wait -n; done
          done < lane/.github/mofa-smoke/k150-builds.tsv
          wait
          while IFS=$'\t' read -r build commit variant; do
            [ "$build" = build ] && continue
            case " ${INSTALL_BUILDS:-$build} " in *" $build "*) ;; *) continue ;; esac
            status=$(cat "$logs/$build.status")
            if [ "$status" != 0 ]; then tail -n 30 "$logs/$build.log"; echo "::error::build $build did not install"; exit 1; fi
            echo "$commit" > "$LIBROOT/$build/k150-build-commit.txt"
            printf '%s\t%s\t%s\t%s\n' "$build" "$commit" "$variant" \
              "$(sed -n 's/^Version: //p' "$LIBROOT/$build/MultiScholaR/DESCRIPTION")" | tee -a "$RES/builds-installed.tsv"
          done < lane/.github/mofa-smoke/k150-builds.tsv

      - name: Measure (k150-plan.sh ${{ matrix.job.plan }} ${{ matrix.job.size }})
        env:
          PLAN: ${{ matrix.job.plan }}
          SIZE: ${{ matrix.job.size }}
          TIMEOUT_MIN: ${{ matrix.job.timeout }}
          JOB_NAME: ${{ matrix.job.name }}
        run: |
          set -o pipefail
          export WORK="$RUNNER_TEMP/k150-work" LANE="$GITHUB_WORKSPACE/lane" K150_CG=/sys/fs/cgroup/k150 \
            K150_LOGS="$RES/logs" BUNDLE LIBROOT RES
          export DEADLINE=$((JOB_STARTED + (TIMEOUT_MIN - 12) * 60))
          mkdir -p "$WORK" "$K150_LOGS"
          sudo mkdir -p "$K150_CG"
          echo "+memory" | sudo tee "$K150_CG/cgroup.subtree_control" > /dev/null
          sha256sum lane/.github/mofa-smoke/k150-* | tee "$RES/script-sha256.txt"
          echo "plan $PLAN size $SIZE; deadline $(date -d "@$DEADLINE" -u +%H:%M:%SZ); setup took $(( $(date +%s) - JOB_STARTED )) s" |
            tee "$RES/plan.txt"
          set +e
          bash lane/.github/mofa-smoke/k150-plan.sh "$PLAN" "$SIZE" 2>&1 | tee "$RES/plan-console.log"
          echo "plan exit $? after $(( $(date +%s) - JOB_STARTED )) s from job start" | tee -a "$RES/plan.txt"
          set -e
          K150_JOB="$JOB_NAME" K150_PLAN="$PLAN" python3 -I lane/.github/mofa-smoke/k150-summarise.py job "$RES"

      - name: Nothing token-like in the upload; files naming the internal packages withheld
        if: ${{ always() }}
        run: |
          if grep -rlE 'ghp_|github_pat_|gho_|Bearer ' "$RES"; then
            echo "::error::token-like text in the result"; exit 1
          fi
          grep -rlE 'fast_duckdb|fast_limpa_dpc|fastduckdb|fastlimpadpc' "$RES" | while read -r f; do
            rm -f "$f"; echo "withheld: ${f#"$RES"/}" | tee -a "$RES/withheld.txt"
          done
          du -sh "$RES"

      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: k150-${{ matrix.job.name }}
          path: ${{ runner.temp }}/result
          retention-days: 30

  summary:
    name: Summary
    needs: [plan, measure]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/mofa-smoke
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: k150-*
          path: ${{ runner.temp }}/jobs
      - name: Summarise once
        run: |
          sha256sum .github/mofa-smoke/k150-summarise.py
          python3 -I .github/mofa-smoke/k150-summarise.py final "$RUNNER_TEMP/jobs" "$RUNNER_TEMP/summary" || { mkdir -p "$RUNNER_TEMP/summary"; echo "final summary not applicable to this plan (KIT-209 G0i)" > "$RUNNER_TEMP/summary/summary.md"; }
          cat "$RUNNER_TEMP/summary/summary.md" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: summary
          path: ${{ runner.temp }}/summary
          retention-days: 30
