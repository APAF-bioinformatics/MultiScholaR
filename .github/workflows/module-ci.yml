name: Module CI

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:
    inputs:
      gate:
        description: "Gate to run: push, nightly, release, or all"
        required: false
        default: "push"
        type: choice
        options:
          - push
          - nightly
          - release
          - all
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

env:
  NOT_CRAN: "true"
  R_KEEP_PKG_SOURCE: "yes"

jobs:
  detect-impact:
    name: detect impact
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_dispatch' &&
        (github.event.inputs.gate == 'push' || github.event.inputs.gate == 'all'))
    runs-on: ubuntu-latest
    outputs:
      impact_level: ${{ steps.impact.outputs.impact_level }}
      module_count: ${{ steps.impact.outputs.module_count }}
      browser_count: ${{ steps.impact.outputs.browser_count }}
      e2e_count: ${{ steps.impact.outputs.e2e_count }}
      run_cross_omic: ${{ steps.impact.outputs.run_cross_omic }}
      run_report_export: ${{ steps.impact.outputs.run_report_export }}
      module_matrix: ${{ steps.impact.outputs.module_matrix }}
      browser_matrix: ${{ steps.impact.outputs.browser_matrix }}
      e2e_matrix: ${{ steps.impact.outputs.e2e_matrix }}
      impact_summary: ${{ steps.impact.outputs.impact_summary }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: r-lib/actions/setup-r@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: any::jsonlite
      - name: Resolve changed-file impact
        id: impact
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_HEAD_SHA: ${{ github.sha }}
        run: |
          mkdir -p tests/testthat/_module_ci_artifacts/impact/detect
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_REF="$PR_BASE_SHA"
            HEAD_REF="$PR_HEAD_SHA"
          else
            BASE_REF="$PUSH_BEFORE_SHA"
            HEAD_REF="$PUSH_HEAD_SHA"
          fi
          Rscript tools/ci/detect-impact.R \
            --base-ref "$BASE_REF" \
            --head-ref "$HEAD_REF" \
            --output tests/testthat/_module_ci_artifacts/impact/detect/impact.json \
            --summary tests/testthat/_module_ci_artifacts/impact/detect/impact.md \
            --github-output "$GITHUB_OUTPUT"
          cat tests/testthat/_module_ci_artifacts/impact/detect/impact.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload impact artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: impact-routing
          retention-days: 14
          path: |
            tests/testthat/_module_ci_artifacts/impact/detect/**

  module-ci-impacted:
    name: module-ci impacted (${{ matrix.name }})
    needs:
      - detect-impact
    if: >-
      needs.detect-impact.result == 'success' &&
      fromJSON(needs.detect-impact.outputs.module_count) > 0
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.detect-impact.outputs.module_matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::pkgload
            any::testthat
            any::jsonlite
      - name: Run impacted module-CI matrix
        run: >
          Rscript tools/ci/run-module-ci.R
          --omic ${{ matrix.omic }}
          --module ${{ matrix.module }}
          --runtime ${{ matrix.runtime }}
          --reporter summary
          --artifact-dir ${{ matrix.artifact_dir }}
      - name: Build scorecard
        if: always()
        run: >
          Rscript tools/ci/module-ci-scorecard.R
          --artifact-dir ${{ matrix.artifact_dir }}
      - name: Append scorecard summary
        if: always()
        run: |
          if [ -f "${{ matrix.artifact_dir }}/module-ci-scorecard.md" ]; then
            cat "${{ matrix.artifact_dir }}/module-ci-scorecard.md" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload impacted module-CI artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: module-ci-impact-${{ matrix.name }}
          retention-days: 14
          path: |
            ${{ matrix.artifact_dir }}/**

  module-ci-browser-impacted:
    name: module-ci browser impacted (${{ matrix.name }})
    needs:
      - detect-impact
    if: >-
      needs.detect-impact.result == 'success' &&
      fromJSON(needs.detect-impact.outputs.browser_count) > 0
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.detect-impact.outputs.browser_matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::pkgload
            any::testthat
            any::jsonlite
            any::shinytest2
            any::chromote
      - name: Set up Chrome
        id: chrome
        uses: browser-actions/setup-chrome@v1
      - name: Configure Chrome for chromote
        run: echo "CHROMOTE_CHROME=${{ steps.chrome.outputs.chrome-path }}" >> "$GITHUB_ENV"
      - name: Run impacted module/browser smoke
        env:
          MULTISCHOLAR_MODULE_CI_ARTIFACT_DIR: ${{ matrix.artifact_dir }}
          MULTISCHOLAR_E2E_ARTIFACT_DIR: tests/testthat/_e2e_artifacts/impact/browser/${{ matrix.name }}
        run: >
          Rscript -e 'Sys.setenv(NOT_CRAN = "true");
          pkgload::load_all(export_all = TRUE, helpers = FALSE, attach_testthat = FALSE);
          testthat::test_dir("tests/testthat", filter = "${{ matrix.filter }}", reporter = "summary")'
      - name: Upload impacted browser artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: module-ci-browser-impact-${{ matrix.name }}
          retention-days: 14
          path: |
            ${{ matrix.artifact_dir }}/**
            tests/testthat/_e2e_artifacts/impact/browser/${{ matrix.name }}/**

  e2e-impacted:
    name: e2e impacted (${{ matrix.name }})
    needs:
      - detect-impact
    if: >-
      needs.detect-impact.result == 'success' &&
      fromJSON(needs.detect-impact.outputs.e2e_count) > 0
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.detect-impact.outputs.e2e_matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::pkgload
            any::testthat
            any::jsonlite
            any::shinytest2
            any::chromote
      - name: Set up Chrome
        id: chrome
        uses: browser-actions/setup-chrome@v1
      - name: Configure Chrome for chromote
        run: echo "CHROMOTE_CHROME=${{ steps.chrome.outputs.chrome-path }}" >> "$GITHUB_ENV"
      - name: Run impacted E2E lane
        env:
          MULTISCHOLAR_E2E_BROWSER_REQUIRED: ${{ matrix.browser_required && 'true' || 'false' }}
        run: |
          mkdir -p "${{ matrix.artifact_dir }}"
          set -o pipefail
          Rscript tools/ci/run-e2e-ci.R \
            --lane "${{ matrix.lane }}" \
            --filter "${{ matrix.filter }}" \
            --reporter summary \
            --artifact-dir "${{ matrix.artifact_dir }}" \
            2>&1 | tee "${{ matrix.artifact_dir }}/test-output.log"
      - name: Upload impacted E2E artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-impact-${{ matrix.name }}
          retention-days: 14
          path: |
            ${{ matrix.artifact_dir }}/**

  cross-omic-impacted:
    name: cross-omic impacted
    needs:
      - detect-impact
    if: >-
      needs.detect-impact.result == 'success' &&
      needs.detect-impact.outputs.run_cross_omic == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::pkgload
            any::testthat
            any::jsonlite
            any::shinytest2
            any::chromote
      - name: Run impacted cross-omic coexistence checks
        env:
          MULTISCHOLAR_E2E_ARTIFACT_DIR: tests/testthat/_e2e_artifacts/impact/cross-omic
        run: >
          Rscript -e 'Sys.setenv(NOT_CRAN = "true");
          pkgload::load_all(export_all = TRUE, helpers = FALSE, attach_testthat = FALSE);
          testthat::test_dir("tests/testthat", filter = "^(e2e-cross-omic|workflow-server-shared|module-ci-sentinels)$", reporter = "summary")'
      - name: Upload impacted cross-omic artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-impact-cross-omic
          retention-days: 14
          path: |
            tests/testthat/_e2e_artifacts/impact/cross-omic/**

  report-export-impacted:
    name: report/export impacted
    needs:
      - detect-impact
    if: >-
      needs.detect-impact.result == 'success' &&
      needs.detect-impact.outputs.run_report_export == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::pkgload
            any::testthat
            any::jsonlite
            any::shinytest2
            any::chromote
      - name: Run impacted report/export checks
        env:
          MULTISCHOLAR_E2E_ARTIFACT_DIR: tests/testthat/_e2e_artifacts/impact/report-export
        run: >
          Rscript -e 'Sys.setenv(NOT_CRAN = "true");
          pkgload::load_all(export_all = TRUE, helpers = FALSE, attach_testthat = FALSE);
          testthat::test_dir("tests/testthat", filter = "^(general-filemgmt-report-helpers-shared|general-filemgmt-export-contracts|e2e-proteomics-enrichment)$", reporter = "summary")'
      - name: Upload impacted report/export artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-impact-report-export
          retention-days: 14
          path: |
            tests/testthat/_e2e_artifacts/impact/report-export/**

  impact-routing-summary:
    name: impact routing summary
    needs:
      - detect-impact
      - module-ci-impacted
      - module-ci-browser-impacted
      - e2e-impacted
      - cross-omic-impacted
      - report-export-impacted
    if: >-
      always() &&
      (github.event_name == 'push' ||
        github.event_name == 'pull_request' ||
        (github.event_name == 'workflow_dispatch' &&
          (github.event.inputs.gate == 'push' || github.event.inputs.gate == 'all')))
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate impacted CI result
        run: |
          {
            echo "# Impact Routing Gate"
            echo ""
            echo "- Impact: \`${{ needs.detect-impact.outputs.impact_level }}\`"
            echo "- Summary: \`${{ needs.detect-impact.outputs.impact_summary }}\`"
            echo "- Detect impact: \`${{ needs.detect-impact.result }}\`"
            echo "- Module CI: \`${{ needs.module-ci-impacted.result }}\`"
            echo "- Browser: \`${{ needs.module-ci-browser-impacted.result }}\`"
            echo "- E2E: \`${{ needs.e2e-impacted.result }}\`"
            echo "- Cross-omic: \`${{ needs.cross-omic-impacted.result }}\`"
            echo "- Report/export: \`${{ needs.report-export-impacted.result }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
          test "${{ needs.detect-impact.result }}" = "success"
          for result in \
            "${{ needs.module-ci-impacted.result }}" \
            "${{ needs.module-ci-browser-impacted.result }}" \
            "${{ needs.e2e-impacted.result }}" \
            "${{ needs.cross-omic-impacted.result }}" \
            "${{ needs.report-export-impacted.result }}"; do
            if [ "$result" = "failure" ] || [ "$result" = "cancelled" ]; then
              exit 1
            fi
          done

  full-gates:
    name: full gate (${{ matrix.name }})
    if: >-
      github.event_name == 'schedule' ||
      startsWith(github.ref, 'refs/tags/v') ||
      startsWith(github.ref, 'refs/heads/release/') ||
      (github.event_name == 'workflow_dispatch' &&
        (github.event.inputs.gate == 'nightly' ||
          github.event.inputs.gate == 'release' ||
          github.event.inputs.gate == 'all'))
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: all-module-unit-contracts
            kind: module-ci
            artifact_dir: tests/testthat/_module_ci_artifacts/full/unit-contracts
          - name: all-current-e2e-workflows
            kind: e2e
            artifact_dir: tests/testthat/_e2e_artifacts/full/current-e2e
          - name: peptide-qc-browser-required
            kind: e2e-required
            artifact_dir: tests/testthat/_e2e_artifacts/full/peptide-qc-browser-required
          - name: alternate-launch-browser-smoke
            kind: browser
            artifact_dir: tests/testthat/_e2e_artifacts/full/alternate-launch
          - name: report-export-fidelity
            kind: report
            artifact_dir: tests/testthat/_e2e_artifacts/full/report-export
          - name: cross-omic-coexistence
            kind: cross-omic
            artifact_dir: tests/testthat/_e2e_artifacts/full/cross-omic
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - uses: r-lib/actions/setup-pandoc@v2
        if: matrix.kind == 'e2e' || matrix.kind == 'e2e-required' || matrix.kind == 'report'
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::pkgload
            any::testthat
            any::jsonlite
            any::shinytest2
            any::chromote
      - name: Set up Chrome
        id: chrome
        if: >-
          matrix.kind == 'e2e' ||
          matrix.kind == 'e2e-required' ||
          matrix.kind == 'browser'
        uses: browser-actions/setup-chrome@v1
      - name: Configure Chrome for chromote
        if: >-
          matrix.kind == 'e2e' ||
          matrix.kind == 'e2e-required' ||
          matrix.kind == 'browser'
        run: echo "CHROMOTE_CHROME=${{ steps.chrome.outputs.chrome-path }}" >> "$GITHUB_ENV"
      - name: Run all unit-contract module scenarios
        if: matrix.kind == 'module-ci'
        run: >
          Rscript tools/ci/run-module-ci.R
          --runtime unit-contract
          --reporter summary
          --artifact-dir ${{ matrix.artifact_dir }}
      - name: Run all current E2E workflows
        if: matrix.kind == 'e2e'
        env:
          MULTISCHOLAR_E2E_ARTIFACT_DIR: ${{ matrix.artifact_dir }}
        run: >
          Rscript -e 'Sys.setenv(NOT_CRAN = "true");
          pkgload::load_all(export_all = TRUE, helpers = FALSE, attach_testthat = FALSE);
          testthat::test_dir("tests/testthat", filter = "^e2e-", reporter = "summary")'
      - name: Run mandatory DIA peptide-QC browser evidence
        if: matrix.kind == 'e2e-required'
        env:
          MULTISCHOLAR_E2E_BROWSER_REQUIRED: "true"
        run: |
          mkdir -p "${{ matrix.artifact_dir }}"
          set -o pipefail
          Rscript tools/ci/run-e2e-ci.R \
            --lane prot_dia \
            --filter '^e2e-proteomics-dia$' \
            --reporter summary \
            --artifact-dir "${{ matrix.artifact_dir }}" \
            2>&1 | tee "${{ matrix.artifact_dir }}/test-output.log"
      - name: Run alternate launch/browser smoke
        if: matrix.kind == 'browser'
        env:
          MULTISCHOLAR_E2E_ARTIFACT_DIR: ${{ matrix.artifact_dir }}
        run: >
          Rscript -e 'Sys.setenv(NOT_CRAN = "true");
          pkgload::load_all(export_all = TRUE, helpers = FALSE, attach_testthat = FALSE);
          testthat::test_dir("tests/testthat", filter = "^(launch-test-mode|e2e-test-mode-integration|e2e-browser-harness)$", reporter = "summary")'
      - name: Run report/export fidelity smoke
        if: matrix.kind == 'report'
        env:
          MULTISCHOLAR_E2E_ARTIFACT_DIR: ${{ matrix.artifact_dir }}
        run: >
          Rscript -e 'Sys.setenv(NOT_CRAN = "true");
          pkgload::load_all(export_all = TRUE, helpers = FALSE, attach_testthat = FALSE);
          testthat::test_dir("tests/testthat", filter = "^(general-filemgmt-report-helpers-shared|general-filemgmt-export-contracts|e2e-proteomics-enrichment)$", reporter = "summary")'
      - name: Run cross-omic coexistence gate
        if: matrix.kind == 'cross-omic'
        env:
          MULTISCHOLAR_E2E_ARTIFACT_DIR: ${{ matrix.artifact_dir }}
        run: >
          Rscript -e 'Sys.setenv(NOT_CRAN = "true");
          pkgload::load_all(export_all = TRUE, helpers = FALSE, attach_testthat = FALSE);
          testthat::test_dir("tests/testthat", filter = "^(e2e-cross-omic|workflow-server-shared|module-ci-sentinels)$", reporter = "summary")'
      - name: Build scorecard
        if: always() && matrix.kind == 'module-ci'
        run: >
          Rscript tools/ci/module-ci-scorecard.R
          --artifact-dir ${{ matrix.artifact_dir }}
      - name: Append scorecard summary
        if: always() && matrix.kind == 'module-ci'
        run: |
          if [ -f "${{ matrix.artifact_dir }}/module-ci-scorecard.md" ]; then
            cat "${{ matrix.artifact_dir }}/module-ci-scorecard.md" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload full-gate artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-gate-${{ matrix.name }}
          retention-days: 30
          path: |
            ${{ matrix.artifact_dir }}/**
            tests/testthat/_module_ci_artifacts/full/**
            tests/testthat/_e2e_artifacts/full/**

  release-candidate-gate:
    name: release candidate promotion gate
    needs:
      - full-gates
    if: >-
      always() &&
      (startsWith(github.ref, 'refs/tags/v') ||
        startsWith(github.ref, 'refs/heads/release/') ||
        (github.event_name == 'workflow_dispatch' &&
          (github.event.inputs.gate == 'release' || github.event.inputs.gate == 'all')))
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate release gate
        run: |
          mkdir -p tests/testthat/_module_ci_artifacts/release-gate
          {
            echo "# Release Candidate Gate"
            echo ""
            echo "- Ref: \`${{ github.ref }}\`"
            echo "- Event: \`${{ github.event_name }}\`"
            echo "- Full gates: \`${{ needs.full-gates.result }}\`"
            echo "- Policy: final release tagging is blocked unless full gates pass."
          } > tests/testthat/_module_ci_artifacts/release-gate/release-gate-summary.md
          cat tests/testthat/_module_ci_artifacts/release-gate/release-gate-summary.md >> "$GITHUB_STEP_SUMMARY"
          test "${{ needs.full-gates.result }}" = "success"
      - name: Upload release gate summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-candidate-gate
          retention-days: 30
          path: |
            tests/testthat/_module_ci_artifacts/release-gate/**
