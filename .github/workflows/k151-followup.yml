name: MOFA2 cap evidence follow-up (KIT-151)

# Run-only lane (branch run-mofa-evidence-k151): the follow-up that separates data-set imbalance, early stopping under
# convergence mode "fast" and the detectability of the small-data-set factor. Declaration:
# docs/qa/workflow-execution/kit/kit-151/cap-followup-declaration.md. One job per scenario x data seed
# (.github/mofa-smoke/k151-followup.R trains every cell in turn); the score job assembles the tables and applies the
# pre-declared readings (.github/mofa-smoke/k151-followup-score.py).
# R, MOFA2's closure and the bundle's Python are installed as the smoke lane installs them; no MultiScholaR, no
# internal packages, no token.
#
# Start: change .github/mofa-smoke/k151-followup-params.json in a commit and push it to run-mofa-evidence-k151.

on:
  push:
    branches:
      - "run-mofa-evidence-k151"
    paths:
      - .github/mofa-smoke/k151-followup-params.json

permissions:
  contents: read

concurrency:
  group: k151-followup-${{ github.ref }}
  cancel-in-progress: false

env:
  R_LIBS_USER: /nonexistent-user-library
  R_LIBS_SITE: /nonexistent-site-library

jobs:
  plan:
    name: Parameters
    runs-on: ubuntu-latest
    outputs:
      scenarios: ${{ steps.plan.outputs.scenarios }}
      seeds: ${{ steps.plan.outputs.seeds }}
      cells: ${{ steps.plan.outputs.cells }}
      modes_n20: ${{ steps.plan.outputs.modes_n20 }}
      modes_n60: ${{ steps.plan.outputs.modes_n60 }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/mofa-smoke
          persist-credentials: false
      - id: plan
        run: |
          p=.github/mofa-smoke/k151-followup-params.json
          jq -e '(.scenarios | type == "array" and length >= 1 and all(IN("n20weak", "n20strong", "n60weak", "n60strong"))) and
            (.seeds | type == "number" and . == floor and . >= 1 and . <= 10) and
            (.cells | type == "string" and test("^[a-z0-9_,@]+$")) and
            (.modes_n20 | type == "array" and length >= 1 and all(IN("fast", "medium", "slow"))) and
            (.modes_n60 | type == "array" and length >= 1 and all(IN("fast", "medium", "slow")))' "$p" > /dev/null \
            || { echo "::error::k151-followup-params.json is not valid"; exit 1; }
          echo "scenarios=$(jq -c .scenarios "$p")" | tee -a "$GITHUB_OUTPUT"
          echo "seeds=$(jq -c '[range(1; .seeds + 1)]' "$p")" | tee -a "$GITHUB_OUTPUT"
          echo "cells=$(jq -r .cells "$p")" | tee -a "$GITHUB_OUTPUT"
          echo "modes_n20=$(jq -r '.modes_n20 | join(",")' "$p")" | tee -a "$GITHUB_OUTPUT"
          echo "modes_n60=$(jq -r '.modes_n60 | join(",")' "$p")" | tee -a "$GITHUB_OUTPUT"

  evidence:
    name: "${{ matrix.scenario }} seed ${{ matrix.seed }}"
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        scenario: ${{ fromJSON(needs.plan.outputs.scenarios) }}
        seed: ${{ fromJSON(needs.plan.outputs.seeds) }}
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Versions from the distributable workflow; paths
        run: |
          for key in R_VERSION PBS_RELEASE PBS_PYTHON; do
            value="$(sed -n "s/^  $key: \"\(.*\)\"$/\1/p" .github/workflows/distributable.yml)"
            test -n "$value" || { echo "::error::$key not found in distributable.yml"; exit 1; }
            echo "$key=$value" | tee -a "$GITHUB_ENV"
          done
          {
            echo "BUNDLE=$RUNNER_TEMP/bundle"
            echo "TOOLS_LIB=$RUNNER_TEMP/tools-lib"
            echo "OUT=$RUNNER_TEMP/evidence"
            echo "RES=$RUNNER_TEMP/result"
          } >> "$GITHUB_ENV"

      - name: R, MOFA2's closure, the bundle's Python (as the smoke lane)
        run: |
          set -o pipefail
          bash packaging/linux/build.sh r
          R_LIBS="$TOOLS_LIB" "/opt/R/$R_VERSION/bin/Rscript" --vanilla .github/mofa-smoke/install-mofa-library.R plan . "$OUT"
          bash packaging/linux/build.sh sysreqs
          R_LIBS="$TOOLS_LIB" "/opt/R/$R_VERSION/bin/Rscript" --vanilla .github/mofa-smoke/install-mofa-library.R install . "$OUT" \
            > "$OUT/install-mofa-library.log" 2>&1 || { tail -n 60 "$OUT/install-mofa-library.log"; exit 1; }
          tail -n 3 "$OUT/install-mofa-library.log"
          bash packaging/linux/build.sh python
          mkdir -p "$BUNDLE/bin"
          install -m 0755 packaging/linux/Rscript "$BUNDLE/bin/Rscript"
          ln -s "/opt/R/$R_VERSION/lib/R" "$BUNDLE/R"

      - name: Train every cell (${{ matrix.scenario }}, seed ${{ matrix.seed }})
        env:
          CELLS: ${{ needs.plan.outputs.cells }}
          SCENARIO: ${{ matrix.scenario }}
          MODES_N20: ${{ needs.plan.outputs.modes_n20 }}
          MODES_N60: ${{ needs.plan.outputs.modes_n60 }}
        run: |
          set -o pipefail
          mkdir -p "$RES"
          cp "$OUT/mofa-library-versions.tsv" "$RES/" || true
          sha256sum .github/mofa-smoke/k151-followup.R .github/mofa-smoke/k151-followup-score.py | tee "$RES/script-sha256.txt"
          case "$SCENARIO" in n60*) MODES="$MODES_N60" ;; *) MODES="$MODES_N20" ;; esac
          "$BUNDLE/bin/Rscript" --vanilla .github/mofa-smoke/k151-followup.R "$RES" "$SCENARIO" \
            "${{ matrix.seed }}" "$CELLS" "$MODES" 2>&1 | grep -vE '^Iteration [0-9]+:' | tail -n 200

      - name: Nothing token-like in the upload
        if: ${{ !cancelled() }}
        run: |
          if grep -rlE 'ghp_|github_pat_|gho_|Bearer ' "$RES"; then echo "::error::token-like text in the result"; exit 1; fi

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: k151f-${{ matrix.scenario }}-${{ matrix.seed }}
          path: ${{ runner.temp }}/result
          retention-days: 30

  score:
    name: Assemble and score
    needs: [plan, evidence]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github/mofa-smoke
            docs/qa/workflow-execution/kit/kit-151
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: k151f-*
          path: ${{ runner.temp }}/jobs
      - name: Score once
        run: |
          sha256sum .github/mofa-smoke/k151-followup-score.py
          python3 -I .github/mofa-smoke/k151-followup-score.py "$RUNNER_TEMP/jobs" .github/mofa-smoke/k151-followup-params.json \
            docs/qa/workflow-execution/kit/kit-151/results-rows.tsv "$RUNNER_TEMP/score"
          cat "$RUNNER_TEMP/score/followup-score.md" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: followup-score
          path: ${{ runner.temp }}/score
          retention-days: 30
