name: KIT-125 null split (DIA_LIMPA)

# KIT-125's DIA_LIMPA null-split study on a hosted runner (sized above one core-hour on the laptop, so not run there;
# ticket revision 1.4). One job, one R process, one attempt.
#
# A run starts when a push to a run-k125* branch changes .github/k125/params.json, and only then. The file names the
# run (label), the commit whose package tree the script loads (package_commit: 0b6fcb6d, the tree of the KIT-124
# simulations), the commit the library's tools are read from (tools_ref, as in k124-sim.yml), the commit of branch
# sim-k124 whose library check is reused read-only (k124_tools_ref: .github/k124-sim/check-library.R and
# laptop-versions.tsv), the number of splits per split type and the script's time limit in minutes.
#
# The job: R 4.6.1 and the library exactly as k124-sim.yml builds it (the KIT-134 snapshot with the two internal
# packages through the read token, sva added, the installed MultiScholaR removed; no cache); the public archive
# downloaded from PRIDE (PXD024043, CC0; nothing of it is committed or uploaded) and checked against the manifest's
# sha256; the lifecycle splits 9001 to 9003 first, compared with the laptop's rows
# (docs/.../kit-125/lifecycle/dia_limpa-reference/runs.tsv; differences are printed, not judged here); then splits
# 1 to <splits> of both split types under `timeout`. The artifact is the two out dirs (per-split aggregates, public
# run names, sidecars) and the script's console output; nothing built with the token is in it.
#
# Launch (from the kit-125 work tree; branch kit-125 itself is not pushed by the ticket):
#   git push origin kit-125:run-k125
# A later run: change `label` in .github/k125/params.json on a commit and push it to run-k125 again.
# Module CI ignores run-k125* branches (module-ci.yml on this branch).

on:
  push:
    branches:
      - "run-k125*"
    paths:
      - .github/k125/params.json

permissions:
  contents: read

env:
  NOT_CRAN: "true"
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  EVIDENCE: docs/qa/workflow-execution/kit/kit-125

jobs:
  dia-limpa:
    name: DIA_LIMPA null split
    runs-on: ubuntu-22.04
    timeout-minutes: 355
    steps:
      - name: The parameters of this push
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github/k125
          persist-credentials: false
      - name: Read .github/k125/params.json
        id: plan
        run: |
          p=.github/k125/params.json
          jq -e '(.label | type == "string" and test("^[A-Za-z0-9][A-Za-z0-9-]{0,30}$")) and
            ([.package_commit, .tools_ref, .k124_tools_ref] | all(type == "string" and test("^[0-9a-f]{40}$"))) and
            ([.splits, .timeout_minutes] | all(type == "number" and . == floor and . >= 1)) and (.timeout_minutes <= 300)' "$p" > /dev/null \
            || { echo "::error::params.json is not valid"; exit 1; }
          for key in label package_commit tools_ref k124_tools_ref splits timeout_minutes; do echo "$key=$(jq -r ".$key" "$p")"; done >> "$GITHUB_OUTPUT"
          { echo '```json'; cat "$p"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: The library's tools (tools_ref) at the workspace root, as k124-sim.yml
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.plan.outputs.tools_ref }}
          persist-credentials: false
      - name: R 4.6.1 and the library (KIT-134 snapshot; internal packages with the read token; no cache)
        uses: ./.github/actions/snapshot-library
        with:
          token: ${{ secrets.DEPS_READ_TOKEN }}
          extra-packages: any::pkgload
      - name: sva from the same snapshot; the installed MultiScholaR removed (as k124-sim.yml)
        run: |
          cat > "$RUNNER_TEMP/sva.R" <<'EOR'
          snapshot <- jsonlite::fromJSON("packaging/multischolar.lock.json")$Snapshot$Date
          options(HTTPUserAgent = sprintf("R/%s R (%s)", getRversion(),
              paste(getRversion(), R.version[["platform"]], R.version[["arch"]], R.version[["os"]])))
          ppm <- "https://packagemanager.posit.co"
          bioc <- sprintf("%s/bioconductor/__linux__/jammy/%s/packages/3.23", ppm, snapshot)
          repos <- c(CRAN = sprintf("%s/cran/__linux__/jammy/%s", ppm, snapshot), BioCsoft = paste0(bioc, "/bioc"),
              BioCann = paste0(bioc, "/data/annotation"))
          available <- utils::available.packages(repos = repos)
          wanted <- unique(c("sva", unlist(tools::package_dependencies("sva", db = available,
              which = c("Depends", "Imports", "LinkingTo"), recursive = TRUE))))
          needed <- setdiff(wanted, rownames(utils::installed.packages(lib.loc = .Library)))
          cat("for sva, not in the library:", paste(needed, collapse = ", "), "\n")
          utils::install.packages(needed, lib = .Library, repos = repos, dependencies = FALSE)
          utils::remove.packages("MultiScholaR", lib = .Library)
          EOR
          R_LIBS="$MSR_TOOLS_LIB" Rscript --vanilla "$RUNNER_TEMP/sva.R"
      - name: This push (scripts, manifest, the laptop's lifecycle rows)
        uses: actions/checkout@v4
        with:
          path: k125
          persist-credentials: false
      - name: The package tree of the KIT-124 simulations (package_commit)
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.plan.outputs.package_commit }}
          path: pkgtree
          persist-credentials: false
      - name: The library check of sim-k124 (k124_tools_ref, read-only)
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.plan.outputs.k124_tools_ref }}
          path: k124tools
          sparse-checkout: .github/k124-sim
          persist-credentials: false
      - name: No LFS filter in the package tree (as k124-sim.yml)
        working-directory: pkgtree
        run: |
          git config filter.lfs.clean cat
          git config filter.lfs.smudge cat
          git config filter.lfs.process ""
          git config filter.lfs.required false
          echo "tracked files reported as modified: $(git status --porcelain --untracked-files=no | wc -l)"
      - name: The library against the laptop's versions
        run: >
          Rscript --vanilla k124tools/.github/k124-sim/check-library.R
          k124tools/.github/k124-sim/laptop-versions.tsv "$RUNNER_TEMP/library.tsv"
      - name: Compile the tree's native code (pkgload::load_all once, outside the script's time)
        working-directory: pkgtree
        run: >
          Rscript -e 'suppressMessages(pkgload::load_all(".", quiet = TRUE));
          cat("MultiScholaR", as.character(utils::packageVersion("MultiScholaR")), "loads from the tree\n")'
      - name: The public archive from PRIDE (PXD024043, CC0), checked against the manifest
        run: |
          mkdir -p "$RUNNER_TEMP/data/dia_limpa"
          row=$(awk -F'\t' '$1 == "dia_limpa"' "k125/$EVIDENCE/data-manifest.tsv")
          url=$(printf '%s' "$row" | cut -f3); sha=$(printf '%s' "$row" | cut -f6); file=$(printf '%s' "$row" | cut -f2)
          curl -fsSL --retry 3 -A "data-fetch/1.0" -o "$RUNNER_TEMP/data/dia_limpa/$file" "$url"
          echo "$sha  $RUNNER_TEMP/data/dia_limpa/$file" | sha256sum -c -
      - name: Lifecycle splits 9001 to 9003, beside the laptop's rows
        working-directory: pkgtree
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          Rscript "../k125/$EVIDENCE/k125_dia_limpa.R" "$RUNNER_TEMP/out/lifecycle" "$RUNNER_TEMP/data/dia_limpa" 3 9001 > "$RUNNER_TEMP/out/lifecycle.out" 2>&1 \
            || { tail -n 40 "$RUNNER_TEMP/out/lifecycle.out"; exit 1; }
          cat > "$RUNNER_TEMP/compare.R" <<'EOR'
          a <- commandArgs(TRUE)
          read <- function(f) utils::read.delim(f, stringsAsFactors = FALSE, quote = "")
          laptop <- read(a[[1L]]); runner <- read(a[[2L]])
          key <- c("split_type", "split", "arm")
          m <- merge(laptop, runner, by = key, suffixes = c(".laptop", ".runner"))
          stopifnot(nrow(m) == nrow(laptop), nrow(m) == nrow(runner))
          for (column in c("status", "k", "n_features", "n_calls")) cat(sprintf("%-11s rows that differ: %d of %d\n", column,
              sum(m[[paste0(column, ".laptop")]] != m[[paste0(column, ".runner")]], na.rm = TRUE), nrow(m)))
          for (column in c("null_p05", "null_p01")) cat(sprintf("%-11s largest absolute difference: %.3g\n", column,
              max(abs(m[[paste0(column, ".laptop")]] - m[[paste0(column, ".runner")]]), na.rm = TRUE)))
          EOR
          Rscript --vanilla "$RUNNER_TEMP/compare.R" "../k125/$EVIDENCE/lifecycle/dia_limpa-reference/runs.tsv" "$RUNNER_TEMP/out/lifecycle/runs.tsv" | tee "$RUNNER_TEMP/out/lifecycle-against-laptop.txt"
      - name: The 100 splits of each split type (one attempt)
        working-directory: pkgtree
        env:
          SPLITS: ${{ steps.plan.outputs.splits }}
          TIMEOUT_MINUTES: ${{ steps.plan.outputs.timeout_minutes }}
        run: |
          nproc; free -g | sed -n 2p
          status=0
          timeout "${TIMEOUT_MINUTES}m" Rscript "../k125/$EVIDENCE/k125_dia_limpa.R" "$RUNNER_TEMP/out/dia_limpa" "$RUNNER_TEMP/data/dia_limpa" "$SPLITS" 1 \
            > "$RUNNER_TEMP/out/dia_limpa.out" 2>&1 || status=$?
          tail -n 20 "$RUNNER_TEMP/out/dia_limpa.out"
          echo "script: exit $status after $SECONDS s"
          if [ "$status" -eq 124 ]; then echo "::error::the script reached its limit of $TIMEOUT_MINUTES minutes (an instrument failure: recorded, not retried)"; fi
          cp "$RUNNER_TEMP/library.tsv" "$RUNNER_TEMP/out/library.tsv"
          printf 'run\t%s\nattempt\t%s\ncommit\t%s\nscript_exit\t%s\nscript_seconds\t%s\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$GITHUB_SHA" "$status" "$SECONDS" > "$RUNNER_TEMP/out/job.tsv"
          exit "$status"
      - name: Upload the out dirs (also after a failure; a partial run is evidence and is not retried)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k125-${{ steps.plan.outputs.label }}-dia-limpa
          path: ${{ runner.temp }}/out
          if-no-files-found: error
          retention-days: 30
