name: KIT-134 distributable

# The distributable (ticket KIT-134, revision 2.0): Electron around a bundled R, library and Python,
# for Linux and Windows. Sources under packaging/.
#
# Only stage internal uses the read token (secret DEPS_READ_TOKEN, given as GITHUB_PAT to the one step
# that installs the library): it adds fastduckdb and fastlimpadpc (internal repositories) at
# the commits packaging/r/install-library.R names (performance-v2's Remotes since daf1e341). Revision 1.2 (IR-B2) while the repositories are internal: a token
# run builds no shell and no installer, uploads no library and no installer, and uploads only a
# summary folder of small text files, checked to be text before the upload; it verifies in the job.
# No job of this workflow uses actions/cache or a setup action's cache (the plan job fails if the
# file names one); Cargo's home is the package's own temporary folder, pip runs with --no-cache-dir.
#
# A push to kit-134 runs a stage only when its commit message names one:
#   [dist:snapshot]   P2 step 1: score the snapshot dates and probe Windows' Bioconductor binaries
#   [dist:library]    P2: the library on both platforms, moved and loaded with the network off
#   [dist:shell]      P3: the library again, then the Electron shell and its lifecycle test
#   [dist:installer]  P4: the shell again, then the installers, installed on fresh runners
#   [dist:container]  D5: the Windows library again, then loaded in a Server Core container
#   [dist:internal]   P2 step 4, P5 and P6, with the token: the library with the internal packages
#                     (Linux required; Windows attempted, D4), checked from the moved folder with the
#                     network off; then, in the same job, the GUI-entry lanes and the browser e2e lanes
#                     against it (Linux: all; Windows: the lanes without DIA)
# fastduckdb is in DESCRIPTION's Imports since 2026-11-18 (the user's decision), so MultiScholaR installs
# only where the internal packages do: every stage but internal stops at the library install until the
# two repositories are public (or the rule of revision 1.2 is changed by the user).
# [dist-linux] or [dist-windows] limits the run to one platform.

on:
  workflow_dispatch:
    inputs:
      stage:
        description: "Stage"
        type: choice
        default: library
        options: [snapshot, library, shell, installer, container, internal]
      platform:
        description: "Platform"
        type: choice
        default: both
        options: [both, linux, windows]
  push:
    branches: [kit-134]
    paths:
      - "packaging/**"
      - ".github/workflows/distributable.yml"

permissions:
  contents: read

concurrency:
  group: distributable-${{ github.ref }}
  cancel-in-progress: true

env:
  R_VERSION: "4.6.1"
  # Bioconductor 3.23's release (bioconductor.org/config.yaml): the first snapshot date scored.
  BIOC_RELEASE_DATE: "2026-04-29"
  # python-build-standalone (astral-sh) release and the CPython in it; MOFA2 pins Python 3.12.
  PBS_RELEASE: "20261110"
  PBS_PYTHON: "3.12.16"
  PANDOC_VERSION: "3.11"
  NODE_VERSION: "22"

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    outputs:
      stage: ${{ steps.plan.outputs.stage }}
      linux: ${{ steps.plan.outputs.linux }}
      windows: ${{ steps.plan.outputs.windows }}
      build: ${{ steps.plan.outputs.build }}
      shell: ${{ steps.plan.outputs.shell }}
      installer: ${{ steps.plan.outputs.installer }}
      container: ${{ steps.plan.outputs.container }}
      internal: ${{ steps.plan.outputs.internal }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/workflows
      - name: No cache in this workflow (revision 1.2, IR-B2)
        run: |
          if grep -nE 'uses: *actions/cache|^ *cache(-dependency-path)?:' .github/workflows/distributable.yml; then
            echo "::error::the distributable workflow must not use a cache"; exit 1
          fi
          echo "no actions/cache step and no setup cache input"
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          MESSAGE: ${{ github.event.head_commit.message }}
          INPUT_STAGE: ${{ inputs.stage }}
          INPUT_PLATFORM: ${{ inputs.platform }}
        run: |
          if [ "$EVENT" = workflow_dispatch ]; then
            stage="$INPUT_STAGE"; platform="$INPUT_PLATFORM"
          else
            stage="$(printf '%s' "$MESSAGE" | grep -o '\[dist:[a-z]*\]' | head -n 1 | sed 's/^\[dist:\(.*\)\]$/\1/')"
            stage="${stage:-none}"
            platform=both
            case "$MESSAGE" in *'[dist-linux]'*) platform=linux ;; *'[dist-windows]'*) platform=windows ;; esac
          fi
          case "$stage" in none|snapshot|library|shell|installer|container|internal) ;; *) echo "::error::unknown stage $stage"; exit 1 ;; esac
          build=false; shell=false; installer=false; container=false; internal=false
          case "$stage" in
            library) build=true ;;
            shell) build=true; shell=true ;;
            installer) build=true; shell=true; installer=true ;;
            container) build=true; container=true; platform=windows ;;
            # never with shell, installer or container: nothing built with the token is packed or uploaded
            internal) build=true; internal=true ;;
          esac
          linux=false; windows=false
          case "$platform" in both) linux=true; windows=true ;; linux) linux=true ;; windows) windows=true ;; esac
          {
            echo "stage=$stage"; echo "linux=$linux"; echo "windows=$windows"
            echo "build=$build"; echo "shell=$shell"; echo "installer=$installer"; echo "container=$container"
            echo "internal=$internal"
          } | tee -a "$GITHUB_OUTPUT"
          echo "stage **$stage**, platform **$platform**" >> "$GITHUB_STEP_SUMMARY"

  # ------------------------------------------------------- P2 step 1: the snapshot date
  snapshot:
    name: "P2: snapshot date and Windows Bioconductor probe"
    needs: plan
    if: needs.plan.outputs.stage == 'snapshot'
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: R ${{ env.R_VERSION }} (Posit r-builds) and jsonlite in a build-tool library
        run: |
          curl -fsSL -o "$RUNNER_TEMP/r.deb" "https://cdn.posit.co/r/ubuntu-2204/pkgs/r-${R_VERSION}_1_amd64.deb"
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends "$RUNNER_TEMP/r.deb"
          mkdir -p "$RUNNER_TEMP/tools-lib"
          "/opt/R/${R_VERSION}/bin/Rscript" --vanilla -e 'install.packages("jsonlite", lib = commandArgs(TRUE)[[1]], repos = "https://packagemanager.posit.co/cran/latest")' "$RUNNER_TEMP/tools-lib"
      - name: Score every snapshot date from Bioconductor 3.23's release to today
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/snapshot"
          R_LIBS="$RUNNER_TEMP/tools-lib" "/opt/R/${R_VERSION}/bin/Rscript" --vanilla packaging/r/snapshot-date.R \
            packaging/multischolar.lock.json "$BIOC_RELEASE_DATE" "$(date -u +%F)" "$RUNNER_TEMP/snapshot" \
            2>&1 | tee "$RUNNER_TEMP/snapshot/snapshot-date.log"
          { echo '### Snapshot date'; echo '```'; cat "$RUNNER_TEMP/snapshot/snapshot-choice.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: snapshot-date
          path: ${{ runner.temp }}/snapshot
          retention-days: 14

  # ------------------------------------------------------------------------- Linux
  linux-build:
    name: "Linux: build (library; shell and archive from stage shell)"
    needs: plan
    if: needs.plan.outputs.build == 'true' && needs.plan.outputs.linux == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 300
    env:
      R_LIBS_USER: /nonexistent-user-library
      R_LIBS_SITE: /nonexistent-site-library
    steps:
      - uses: actions/checkout@v4

      - name: Paths
        run: |
          {
            echo "BUNDLE=$RUNNER_TEMP/stage/bundle"
            echo "MOVED=$RUNNER_TEMP/relocated/msr moved"
            echo "TOOLS_LIB=$RUNNER_TEMP/tools-lib"
            echo "OUT=$RUNNER_TEMP/evidence"
            echo "RLIB=/opt/R/$R_VERSION/lib/R/library"
          } >> "$GITHUB_ENV"
          echo "runner's own R: $(command -v R || echo none); Python: $(command -v python3 || echo none)"

      - name: R ${{ env.R_VERSION }} at its build prefix (Posit r-builds); jsonlite in a build-tool library
        run: |
          curl -fsSL -o "$RUNNER_TEMP/r.deb" "https://cdn.posit.co/r/ubuntu-2204/pkgs/r-${R_VERSION}_1_amd64.deb"
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends "$RUNNER_TEMP/r.deb"
          sudo chown -R "$(id -u):$(id -g)" "/opt/R/${R_VERSION}"
          mkdir -p "$TOOLS_LIB" "$OUT"
          "/opt/R/${R_VERSION}/bin/Rscript" --vanilla -e 'install.packages("jsonlite", lib = commandArgs(TRUE)[[1]], repos = "https://packagemanager.posit.co/cran/latest")' "$TOOLS_LIB"

      - name: Resolve the library (plan; nothing installed)
        run: R_LIBS="$TOOLS_LIB" "/opt/R/${R_VERSION}/bin/Rscript" --vanilla packaging/r/install-library.R plan . "$OUT"

      - name: System libraries the packages need (Posit Package Manager's requirements for jammy)
        run: |
          set -o pipefail
          query() { # repository, then package names; prints the apt packages
            local repo="$1"; shift
            local extra=""; [ "$repo" = bioconductor ] && extra="&bioc_version=3.23"
            local url="https://packagemanager.posit.co/__api__/repos/$repo/sysreqs?all=false&distribution=ubuntu&release=22.04$extra$(printf '&pkgname=%s' "$@")"
            if ! curl -fsS "$url" | jq -r '.requirements[].requirements.packages[]?' 2>/dev/null; then
              # an unknown name fails the whole query: ask one at a time and say which were skipped
              if [ "$#" -gt 1 ]; then for p in "$@"; do query "$repo" "$p"; done
              else echo "no system requirements known for $repo/$1" >&2; fi
            fi
          }
          : > "$RUNNER_TEMP/apt.txt"
          for pair in CRAN:cran Bioconductor:bioconductor; do
            mapfile -t names < <(awk -F'\t' -v r="${pair%%:*}" 'NR > 1 && $2 == r { print $1 }' "$OUT/plan-packages.tsv")
            for ((i = 0; i < ${#names[@]}; i += 60)); do query "${pair##*:}" "${names[@]:i:60}" >> "$RUNNER_TEMP/apt.txt"; done
          done
          sort -u "$RUNNER_TEMP/apt.txt" | tee "$OUT/apt-packages.txt"
          sudo apt-get install -y --no-install-recommends $(sort -u "$RUNNER_TEMP/apt.txt")

      - name: "Rust for the internal packages (token run; rustc 1.88 or later)"
        if: needs.plan.outputs.internal == 'true'
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustc --version; cargo --version

      - name: "Install the library: snapshot binaries, the source builds, the internal packages (token run), MultiScholaR from this commit"
        env:
          MSR_INTERNAL: ${{ needs.plan.outputs.internal == 'true' && 'required' || '' }}
          GITHUB_PAT: ${{ needs.plan.outputs.internal == 'true' && secrets.DEPS_READ_TOKEN || '' }}
        run: |
          set -o pipefail
          R_LIBS="$TOOLS_LIB" "/opt/R/${R_VERSION}/bin/Rscript" --vanilla packaging/r/install-library.R install . "$OUT" \
            2>&1 | tee "$OUT/install-library.log"
          grep '^INTERNAL ' "$OUT/install-library.log" || true
          echo "installed as binary packages: $(grep -c 'installing \*binary\* package' "$OUT/install-library.log" || true)"
          echo "built from source:"; grep 'installing \*source\* package' "$OUT/install-library.log" || true

      - name: The version table against the laptop's lockfile
        run: |
          set -o pipefail
          R_LIBS="$TOOLS_LIB" "/opt/R/${R_VERSION}/bin/Rscript" --vanilla packaging/r/version-table.R . "$RLIB" \
            "$OUT/bundle-sources.tsv" "$OUT/install-library.log" "$OUT" 2>&1 | tee "$OUT/version-table.log"
          cat "$OUT/version-table.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Standalone Python with mofapy2 (hashes checked)
        run: |
          mkdir -p "$BUNDLE"
          curl -fsSL -o "$RUNNER_TEMP/python.tar.gz" \
            "https://github.com/astral-sh/python-build-standalone/releases/download/${PBS_RELEASE}/cpython-${PBS_PYTHON}%2B${PBS_RELEASE}-x86_64-unknown-linux-gnu-install_only.tar.gz"
          tar -xzf "$RUNNER_TEMP/python.tar.gz" -C "$BUNDLE"
          PYTHONNOUSERSITE=1 "$BUNDLE/python/bin/python3" -m pip install --no-cache-dir --no-warn-script-location \
            --require-hashes --only-binary=:all: --no-deps -r packaging/python/requirements.txt
          "$BUNDLE/python/bin/python3" -m pip list | tee "$OUT/python-packages.txt"

      - name: Pandoc ${{ env.PANDOC_VERSION }}
        run: |
          curl -fsSL -o "$RUNNER_TEMP/pandoc.tar.gz" \
            "https://github.com/jgm/pandoc/releases/download/${PANDOC_VERSION}/pandoc-${PANDOC_VERSION}-linux-amd64.tar.gz"
          mkdir -p "$RUNNER_TEMP/pandoc" "$BUNDLE/pandoc"
          tar -xzf "$RUNNER_TEMP/pandoc.tar.gz" -C "$RUNNER_TEMP/pandoc"
          install -m 0755 "$RUNNER_TEMP/pandoc/pandoc-${PANDOC_VERSION}/bin/pandoc" "$BUNDLE/pandoc/pandoc"
          "$BUNDLE/pandoc/pandoc" --version | head -n 1

      - name: Assemble the bundle; remove R from its build prefix
        run: |
          bash packaging/linux/assemble.sh "/opt/R/${R_VERSION}/lib/R" "$BUNDLE" 2>&1 | tee "$OUT/assemble.log"
          sudo rm -rf "/opt/R/${R_VERSION}"
          {
            echo "### Linux bundle, size (MiB)"
            echo '```'
            for part in "" /R /R/library /python /syslib /pandoc; do du -sm "$BUNDLE$part"; done
            echo "files: $(find "$BUNDLE" -type f | wc -l)"
            echo "largest R packages:"; du -sm "$BUNDLE"/R/library/* | sort -rn | sed -n 1,12p
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY" "$OUT/sizes.txt"

      - name: Move the folder; fetch the bare container image
        id: move
        run: |
          mkdir -p "$(dirname "$MOVED")"
          mv "$BUNDLE" "$MOVED"
          test ! -e "/opt/R/${R_VERSION}"
          docker pull -q ubuntu:22.04

      - name: "Check: every bundled package loads (moved, bare ubuntu:22.04, path with spaces, network off)"
        id: check
        if: ${{ !cancelled() && steps.move.outcome == 'success' }}
        run: |
          set -o pipefail
          bash packaging/verify/linux-bare-container.sh none "$MOVED" "/srv/any where/msr app" check-library.R offline \
            2>&1 | tee "$OUT/check-library.log"

      # ------------------------------------- token run (stage internal): verified in this job
      - name: "Check: the internal packages, the DIA manifest and the engines (moved, bare ubuntu:22.04, network off)"
        if: ${{ !cancelled() && needs.plan.outputs.internal == 'true' && steps.move.outcome == 'success' }}
        run: |
          set -o pipefail
          bash packaging/verify/linux-bare-container.sh none "$MOVED" "/srv/any where/msr app" check-internal.R required \
            2>&1 | tee "$OUT/check-internal.log"

      - name: "Test tools: testthat, shinytest2 and what the bundle lacks for them, from the snapshot, in a separate library"
        id: testtools
        if: ${{ !cancelled() && needs.plan.outputs.internal == 'true' && steps.check.outcome == 'success' }}
        run: |
          set -o pipefail
          echo "TEST_TOOLS=$RUNNER_TEMP/test-tools" >> "$GITHUB_ENV"
          "$MOVED/bin/Rscript" --vanilla packaging/verify/test-tools.R "$RUNNER_TEMP/test-tools" \
            "$(jq -r .Snapshot.Date packaging/multischolar.lock.json)" shinytest2 2>&1 | tee "$OUT/test-tools.log"

      - name: "Lanes: every GUI-entry lane in process against the bundle (moved, network closed, the laptop's locale)"
        if: ${{ !cancelled() && needs.plan.outputs.internal == 'true' && steps.testtools.outcome == 'success' }}
        timeout-minutes: 90
        run: |
          sudo locale-gen en_GB.UTF-8 en_AU.UTF-8 > /dev/null
          mkdir -p "$OUT/lanes"
          sudo unshare --net -- bash -c 'ip link set lo up && exec sudo -u "$0" env HOME="$1" LANG=en_GB.UTF-8 \
            LC_CTYPE=en_GB.UTF-8 LC_COLLATE=en_GB.UTF-8 LC_MESSAGES=en_GB.UTF-8 LC_NUMERIC=en_AU.UTF-8 LC_TIME=en_AU.UTF-8 \
            LC_MONETARY=en_AU.UTF-8 LC_PAPER=en_AU.UTF-8 LC_MEASUREMENT=en_AU.UTF-8 \
            "$2/bin/Rscript" --vanilla "$3/packaging/verify/run-lanes.R" "$3" "$4" "$5" prot_dia prot_dia_limpa \
            prot_tmt prot_lfq prot_lfq_fragpipe metab_lc metab_gc metab_combined lipid_canonical trx_screen' \
            "$(id -un)" "$HOME" "$MOVED" "$GITHUB_WORKSPACE" "$TEST_TOOLS" "$OUT/lanes" 2>&1 | tee "$OUT/lanes.log"
          status="${PIPESTATUS[0]}"
          { echo '### GUI-entry lanes against the bundle (token run)'; echo '```'; cat "$OUT/lanes/lane-summary.tsv" 2>/dev/null; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      # P5: the seven browser e2e lanes, the application being the bundle's installed package
      # (MULTISCHOLAR_E2E_INSTALLED=1); Chrome is the runner's. CI=true as in Module CI's e2e jobs.
      - name: "e2e lanes: the seven browser lanes against the bundle's installed package (moved, network closed, the laptop's locale)"
        if: ${{ !cancelled() && needs.plan.outputs.internal == 'true' && steps.testtools.outcome == 'success' }}
        timeout-minutes: 120
        run: |
          sudo locale-gen en_GB.UTF-8 en_AU.UTF-8 > /dev/null
          mkdir -p "$OUT/e2e"
          sudo unshare --net -- bash -c 'ip link set lo up && exec sudo -u "$0" env HOME="$1" CI=true LANG=en_GB.UTF-8 \
            LC_CTYPE=en_GB.UTF-8 LC_COLLATE=en_GB.UTF-8 LC_MESSAGES=en_GB.UTF-8 LC_NUMERIC=en_AU.UTF-8 LC_TIME=en_AU.UTF-8 \
            LC_MONETARY=en_AU.UTF-8 LC_PAPER=en_AU.UTF-8 LC_MEASUREMENT=en_AU.UTF-8 \
            "$2/bin/Rscript" --vanilla "$3/packaging/verify/run-e2e.R" "$3" "$4" "$5" lipidomics-canonical \
            metabolomics-lc-gc transcriptomics-screen proteomics-dia proteomics-dia-limpa proteomics-enrichment \
            proteomics-tmt-lfq' \
            "$(id -un)" "$HOME" "$MOVED" "$GITHUB_WORKSPACE" "$TEST_TOOLS" "$OUT/e2e" 2>&1 | tee "$OUT/e2e.log"
          status="${PIPESTATUS[0]}"
          { echo '### Browser e2e lanes against the bundle (token run)'; echo '```'; cat "$OUT/e2e/e2e-summary.tsv" 2>/dev/null; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: "Summary for upload: small text files only (token run)"
        id: summary
        if: ${{ !cancelled() && needs.plan.outputs.internal == 'true' }}
        run: |
          summary="$RUNNER_TEMP/summary"
          mkdir -p "$summary"
          # install-library.log is not uploaded from a token run (the internal packages' build output is
          # also kept out of it, under the runner's temporary folder, never printed).
          for f in plan-packages.tsv apt-packages.txt internal-packages.tsv bundle-sources.tsv \
            version-table.tsv version-table.md version-table.log python-packages.txt sizes.txt check-library.log \
            check-internal.log test-tools.log lanes.log lanes/lane-summary.tsv lanes/lane-differences.tsv lanes/lane-failures.tsv \
            e2e.log e2e/e2e-summary.tsv e2e/e2e-failures.tsv; do
            if [ -f "$OUT/$f" ]; then cp "$OUT/$f" "$summary/"; fi
          done
          for f in "$summary"/*; do
            # every byte: a NUL anywhere, or more than 20 MiB, and nothing is uploaded
            if [ "$(stat -c %s "$f")" -gt 20971520 ] || [ "$(tr -d '\000' < "$f" | wc -c)" != "$(stat -c %s "$f")" ]; then
              echo "::error::$f is not a small text file; nothing is uploaded"; exit 1
            fi
          done
          ls -l "$summary"

      - name: Upload the summary (text only; token run)
        if: ${{ !cancelled() && needs.plan.outputs.internal == 'true' && steps.summary.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: linux-internal-summary
          path: ${{ runner.temp }}/summary
          retention-days: 14

      # ------------------------------------------------ P3: the shell (stage shell and later)
      - uses: actions/setup-node@v4
        if: needs.plan.outputs.shell == 'true' && steps.check.outcome == 'success'
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Version stamp and third-party notices
        id: stamp
        if: needs.plan.outputs.shell == 'true' && steps.check.outcome == 'success'
        run: |
          set -o pipefail
          version="$(sed -n 's/^Version: *//p' DESCRIPTION)"
          test "$(node -p "require('./packaging/electron/package.json').version")" = "$version"
          electron="$(node -p "require('./packaging/electron/package-lock.json').packages['node_modules/electron'].version")"
          "$MOVED/bin/Rscript" --vanilla packaging/r/notices.R "$MOVED" . "$OUT/bundle-sources.tsv" packaging/electron/stamp "$electron" \
            2>&1 | tee "$OUT/notices.log"
          cp packaging/electron/stamp/VERSION.json packaging/electron/stamp/THIRD-PARTY-NOTICES.txt \
            packaging/electron/stamp/sources-list.tsv "$OUT/"
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: The Electron shell (directory target)
        id: electron
        if: needs.plan.outputs.shell == 'true' && steps.stamp.outcome == 'success'
        working-directory: packaging/electron
        run: |
          mkdir -p build
          cp ../../inst/shiny/www/MultiScholaR.png build/icon.png
          mv "$MOVED" runtime
          npm ci --no-audit --no-fund
          npx electron-builder --linux dir --publish never
          ls -l dist/linux-unpacked

      - name: "P3 lifecycle: the unpacked application on the build runner (network closed)"
        if: needs.plan.outputs.shell == 'true' && steps.electron.outcome == 'success'
        run: |
          app="$PWD/packaging/electron/dist/linux-unpacked"
          echo "apparmor_restrict_unprivileged_userns: $(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns 2>/dev/null || echo absent)"
          sudo unshare --net -- bash -c 'ip link set lo up && exec sudo -E -u "$0" env PATH="$1" HOME="$2" \
            xvfb-run -a node packaging/electron/lifecycle-test.js "$3" "$4/multischolar" "$4" --expect-launcher process --network-closed' \
            "$(id -un)" "$PATH" "$HOME" "Linux, unpacked, ubuntu-22.04 build runner" "$app" 2>&1 | tee "$OUT/lifecycle-build-runner.log"
          exit "${PIPESTATUS[0]}"

      - name: The Linux archive (per-user install.sh, D2)
        id: archive
        if: needs.plan.outputs.shell == 'true' && steps.electron.outcome == 'success'
        run: |
          name="MultiScholaR-${VERSION}"
          stage="$RUNNER_TEMP/archive/$name"
          mkdir -p "$stage" "$RUNNER_TEMP/dist"
          cp -a packaging/electron/dist/linux-unpacked "$stage/app"
          install -m 0755 packaging/linux/install.sh packaging/linux/uninstall.sh "$stage/"
          cp packaging/linux/multischolar.desktop "$stage/"
          cp packaging/electron/build/icon.png "$stage/multischolar.png"
          cp packaging/electron/stamp/VERSION.json packaging/electron/stamp/THIRD-PARTY-NOTICES.txt "$stage/"
          archive="$RUNNER_TEMP/dist/$name-linux-x86_64.tar.gz"
          start=$(date +%s)
          tar -C "$RUNNER_TEMP/archive" -czf "$archive" "$name"
          (cd "$RUNNER_TEMP/dist" && sha256sum "$(basename "$archive")" > "$(basename "$archive").sha256")
          {
            echo "### Linux archive"
            echo '```'
            echo "$(basename "$archive"): $(stat -c %s "$archive") bytes ($(( $(stat -c %s "$archive") / 1048576 )) MiB), packed in $(( $(date +%s) - start )) s"
            echo "unpacked: $(du -sm "$stage" | cut -f1) MiB in $(find "$stage" -type f | wc -l) files"
            cat "$archive.sha256"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY" "$OUT/archive.txt"

      - name: Upload the Linux archive
        if: needs.plan.outputs.shell == 'true' && needs.plan.outputs.internal != 'true' && steps.archive.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: linux-archive
          path: ${{ runner.temp }}/dist
          compression-level: 0
          retention-days: 14
          if-no-files-found: error

      - name: Keep the evidence (text only; not in a token run, which uploads its summary instead)
        if: ${{ !cancelled() && needs.plan.outputs.internal != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: linux-build-evidence
          path: |
            ${{ runner.temp }}/evidence
            !${{ runner.temp }}/evidence/github-sources
          retention-days: 14

  linux-install:
    name: "Linux: install.sh and lifecycle on ${{ matrix.runner }} (network closed)"
    needs: [plan, linux-build]
    if: ${{ !cancelled() && needs.plan.outputs.shell == 'true' && needs.linux-build.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-24.04 from stage shell (Electron's sandbox restriction, F10); a fresh ubuntu-22.04 from stage installer
        runner: ${{ fromJSON(needs.plan.outputs.installer == 'true' && '["ubuntu-22.04", "ubuntu-24.04"]' || '["ubuntu-24.04"]') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      # The whole tree: the report check below runs GUI-entry lanes from tests/ (their helpers read other
      # folders of the source tree); the package they test is the installed application's.
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/download-artifact@v4
        with:
          name: linux-archive
          path: ${{ runner.temp }}/download
      - name: Install with install.sh, as the runner's user
        id: install
        run: |
          command -v xvfb-run >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq xvfb; }
          cd "$RUNNER_TEMP/download"
          sha256sum -c ./*.sha256
          archive="$(ls ./*.tar.gz)"
          echo "archive: $archive, $(stat -c %s "$archive") bytes"
          echo "runner's own R: $(command -v R || echo none); glibc $(getconf GNU_LIBC_VERSION)"
          start=$(date +%s)
          tar -xzf "$archive"
          ./MultiScholaR-*/install.sh
          version="$(sed -n 's/^ *"release": *"\([^"]*\)".*$/\1/p' MultiScholaR-*/VERSION.json | head -n 1)"
          dest="$HOME/.local/share/multischolar/$version"
          echo "DEST=$dest" >> "$GITHUB_ENV"
          {
            echo "### Linux install on ${{ matrix.runner }}"
            echo '```'
            echo "unpacked and installed in $(( $(date +%s) - start )) s into $dest"
            echo "installed: $(du -sm "$dest" | cut -f1) MiB in $(find "$dest" -type f | wc -l) files"
            echo "menu entry: $(ls "$HOME/.local/share/applications/multischolar.desktop")"
            echo "apparmor_restrict_unprivileged_userns: $(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns 2>/dev/null || echo absent)"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          grep -q "Exec=\"$dest/multischolar\"" "$HOME/.local/share/applications/multischolar.desktop"
      - name: "P3 lifecycle: the installed application (plain launcher, network closed; on 24.04 because no user D-Bus answers)"
        run: |
          # ubuntu-22.04: the kernel is older than 6.12. ubuntu-24.04: every host requirement holds except a user
          # D-Bus, which a desktop session has and the hosted runner lacks, also after dbus-user-session (runs
          # 44055833237 and 44059705566); the shell's probe then gives the plain launcher with that reason. The
          # systemd worker from the bundle is tested on the laptop (a real login session), not on a hosted runner.
          reason=""
          if [ "${{ matrix.runner }}" = ubuntu-24.04 ]; then reason="D-Bus"; fi
          sudo unshare --net -- bash -c 'ip link set lo up && exec sudo -E -u "$0" env PATH="$1" HOME="$2" \
            xvfb-run -a node packaging/electron/lifecycle-test.js "$3" "$4/multischolar" "$4" --expect-launcher process \
            --network-closed ${5:+--expect-reason "$5"}' \
            "$(id -un)" "$PATH" "$HOME" "Linux, installed with install.sh, ${{ matrix.runner }}" "$DEST" "$reason"
      # W1 (outcome.md): the Summary report from the installed application with no browser to be found.
      - name: "Report check: test tools from the snapshot, in a separate library (installed application's R)"
        id: testtools
        if: ${{ !cancelled() && matrix.runner == 'ubuntu-22.04' && steps.install.outcome == 'success' }}
        run: |
          echo "TEST_TOOLS=$RUNNER_TEMP/test-tools" >> "$GITHUB_ENV"
          "$DEST/app/resources/runtime/bin/Rscript" --vanilla packaging/verify/test-tools.R "$RUNNER_TEMP/test-tools" \
            "$(jq -r .Snapshot.Date packaging/multischolar.lock.json)"
      - name: "Report check: a Summary report renders to .docx with every Chrome-type browser hidden (lipidomics and metabolomics entry lanes, network closed)"
        if: ${{ !cancelled() && steps.testtools.outcome == 'success' }}
        timeout-minutes: 30
        run: |
          # The bundle's R runs with PATH=/usr/bin:/bin (packaging/linux/Rscript): the runner's browsers are taken
          # out of those folders, and chromote is pointed at a path that does not exist.
          for name in google-chrome google-chrome-stable chrome chromium chromium-browser chrome-headless-shell \
            microsoft-edge microsoft-edge-stable msedge; do
            for dir in /usr/bin /bin /usr/local/bin /snap/bin; do
              if [ -e "$dir/$name" ] || [ -L "$dir/$name" ]; then
                echo "hiding $dir/$name ($(readlink -f "$dir/$name" || true))"
                sudo rm -f "$dir/$name"
              fi
            done
          done
          sudo locale-gen en_GB.UTF-8 en_AU.UTF-8 > /dev/null
          out="$RUNNER_TEMP/report-lanes"
          mkdir -p "$out"
          sudo unshare --net -- bash -c 'ip link set lo up && exec sudo -u "$0" env HOME="$1" LANG=en_GB.UTF-8 \
            LC_CTYPE=en_GB.UTF-8 LC_COLLATE=en_GB.UTF-8 LC_MESSAGES=en_GB.UTF-8 LC_NUMERIC=en_AU.UTF-8 LC_TIME=en_AU.UTF-8 \
            LC_MONETARY=en_AU.UTF-8 LC_PAPER=en_AU.UTF-8 LC_MEASUREMENT=en_AU.UTF-8 \
            CHROMOTE_CHROME=/nonexistent/no-browser/chrome MSR_REPORT_CHECK=1 \
            "$2/bin/Rscript" --vanilla "$3/packaging/verify/run-lanes.R" "$3" "$4" "$5" lipid_canonical metab_lc' \
            "$(id -un)" "$HOME" "$DEST/app/resources/runtime" "$GITHUB_WORKSPACE" "$TEST_TOOLS" "$out" 2>&1 | tee "$out/report-lanes.log"
          status="${PIPESTATUS[0]}"
          {
            echo '### Report check, Linux (installed application, no browser to be found)'; echo '```'
            grep -E '^(BROWSERS|RENDER|REPORT|LANE|network|KIT-134)[ :]' "$out/report-lanes.log" || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
      - name: Uninstall
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          "$DEST/uninstall.sh"
          test ! -e "$DEST"
          test ! -e "$HOME/.local/share/applications/multischolar.desktop"

  # ------------------------------------------------------------------------ Windows
  windows-build:
    name: "Windows: build (library; shell from stage shell, installer from stage installer, D5 container)"
    needs: plan
    if: needs.plan.outputs.build == 'true' && needs.plan.outputs.windows == 'true'
    runs-on: windows-2025
    timeout-minutes: 300
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - name: Paths
        run: |
          "BUNDLE=$env:RUNNER_TEMP\stage\bundle" >> $env:GITHUB_ENV
          "MOVED=$env:RUNNER_TEMP\re located\msr moved" >> $env:GITHUB_ENV
          "TOOLS_LIB=$env:RUNNER_TEMP\tools-lib" >> $env:GITHUB_ENV
          "OUT=$env:RUNNER_TEMP\evidence" >> $env:GITHUB_ENV
          "R_LIBS_USER=$env:RUNNER_TEMP\nonexistent-user-library" >> $env:GITHUB_ENV
          "R_LIBS_SITE=$env:RUNNER_TEMP\nonexistent-site-library" >> $env:GITHUB_ENV
          "runner's own R on the PATH: $((Get-Command Rscript.exe -ErrorAction SilentlyContinue).Source); Python: $((Get-Command python -ErrorAction SilentlyContinue).Source)"

      - name: R ${{ env.R_VERSION }} into the folder (CRAN installer, silent); Rtools45 for the build
        run: |
          pwsh -NoProfile -File packaging\windows\assemble.ps1 -Action r -Bundle $env:BUNDLE -RVersion $env:R_VERSION
          New-Item -ItemType Directory -Force $env:TOOLS_LIB, $env:OUT | Out-Null
          & "$env:BUNDLE\R\bin\Rscript.exe" --vanilla -e "install.packages('jsonlite', lib = commandArgs(TRUE)[[1]], repos = 'https://packagemanager.posit.co/cran/latest', type = 'binary')" $env:TOOLS_LIB
          if ($LASTEXITCODE -ne 0) { throw "could not install jsonlite into the build-tool library" }

      - name: "Rust for the internal packages (token run): the GNU target R links against"
        if: needs.plan.outputs.internal == 'true'
        run: |
          rustup target add x86_64-pc-windows-gnu
          rustc --version; cargo --version; rustup show

      - name: "Install the library: snapshot binaries, the source builds, the internal packages attempted (token run), MultiScholaR from this commit"
        env:
          MSR_INTERNAL: ${{ needs.plan.outputs.internal == 'true' && 'attempt' || '' }}
          GITHUB_PAT: ${{ needs.plan.outputs.internal == 'true' && secrets.DEPS_READ_TOKEN || '' }}
        run: |
          $env:PATH = "C:\rtools45\x86_64-w64-mingw32.static.posix\bin;C:\rtools45\usr\bin;$env:PATH"
          $env:R_LIBS = $env:TOOLS_LIB
          $rscript = "$env:BUNDLE\R\bin\Rscript.exe"
          & $rscript --vanilla packaging\r\install-library.R plan . $env:OUT
          if ($LASTEXITCODE -ne 0) { throw "plan failed" }
          & $rscript --vanilla packaging\r\install-library.R install . $env:OUT *>&1 | Tee-Object -FilePath "$env:OUT\install-library.log"
          if ($LASTEXITCODE -ne 0) { throw "install failed" }
          "built from source:"; Select-String -Path "$env:OUT\install-library.log" -Pattern 'installing \*source\* package' | ForEach-Object Line
          Select-String -Path "$env:OUT\install-library.log" -Pattern '^INTERNAL ' | ForEach-Object Line

      - name: The version table against the laptop's lockfile
        run: |
          $env:R_LIBS = $env:TOOLS_LIB
          & "$env:BUNDLE\R\bin\Rscript.exe" --vanilla packaging\r\version-table.R . "$env:BUNDLE\R\library" "$env:OUT\bundle-sources.tsv" "$env:OUT\install-library.log" $env:OUT *>&1 | Tee-Object -FilePath "$env:OUT\version-table.log"
          if ($LASTEXITCODE -ne 0) { throw "version table failed" }
          Get-Content "$env:OUT\version-table.md" >> $env:GITHUB_STEP_SUMMARY

      - name: Standalone Python with mofapy2 (hashes checked)
        run: |
          curl.exe -fsSL -o "$env:RUNNER_TEMP\python.tar.gz" "https://github.com/astral-sh/python-build-standalone/releases/download/${env:PBS_RELEASE}/cpython-${env:PBS_PYTHON}%2B${env:PBS_RELEASE}-x86_64-pc-windows-msvc-install_only.tar.gz"
          & "$env:SystemRoot\System32\tar.exe" -xzf "$env:RUNNER_TEMP\python.tar.gz" -C $env:BUNDLE
          if ($LASTEXITCODE -ne 0) { throw "could not unpack Python" }
          $env:PYTHONNOUSERSITE = '1'
          & "$env:BUNDLE\python\python.exe" -m pip install --no-cache-dir --no-warn-script-location --require-hashes --only-binary=:all: --no-deps -r packaging\python\requirements.txt
          if ($LASTEXITCODE -ne 0) { throw "pip install failed" }
          & "$env:BUNDLE\python\python.exe" -m pip list | Tee-Object -FilePath "$env:OUT\python-packages.txt"

      - name: Pandoc ${{ env.PANDOC_VERSION }}
        run: |
          curl.exe -fsSL -o "$env:RUNNER_TEMP\pandoc.zip" "https://github.com/jgm/pandoc/releases/download/${env:PANDOC_VERSION}/pandoc-${env:PANDOC_VERSION}-windows-x86_64.zip"
          Expand-Archive -LiteralPath "$env:RUNNER_TEMP\pandoc.zip" -DestinationPath "$env:RUNNER_TEMP\pandoc"
          New-Item -ItemType Directory -Force "$env:BUNDLE\pandoc" | Out-Null
          Copy-Item "$env:RUNNER_TEMP\pandoc\pandoc-${env:PANDOC_VERSION}\*" "$env:BUNDLE\pandoc\" -Recurse
          & "$env:BUNDLE\pandoc\pandoc.exe" --version | Select-Object -First 1

      # Token run: the test tools are fetched before the check step cuts the network for the bundle's programs.
      - name: "Test tools: testthat, shinytest2 and what the bundle lacks for them, from the snapshot, in a separate library (token run)"
        id: testtools
        if: needs.plan.outputs.internal == 'true'
        run: |
          "TEST_TOOLS=$env:RUNNER_TEMP\test-tools" >> $env:GITHUB_ENV
          $date = (Get-Content packaging\multischolar.lock.json -Raw | ConvertFrom-Json).Snapshot.Date
          & packaging\verify\windows-clean-run.ps1 -Bundle $env:BUNDLE -Script packaging\verify\test-tools.R -NoBundleArgument -Arguments "$env:RUNNER_TEMP\test-tools", $date, shinytest2 *>&1 | Tee-Object -FilePath "$env:OUT\test-tools.log"
          if ($LASTEXITCODE -ne 0) { throw "the test tools were not installed" }

      - name: Size; move the folder to a path with spaces
        id: move
        run: |
          function Get-SizeMiB($path) { [math]::Round((Get-ChildItem -LiteralPath $path -Recurse -File -Force | Measure-Object Length -Sum).Sum / 1MB) }
          $lines = @('### Windows bundle, size (MiB)', '```')
          foreach ($part in '.', 'R', 'R\library', 'python', 'pandoc') { $lines += "{0,6}  bundle\{1}" -f (Get-SizeMiB (Join-Path $env:BUNDLE $part)), $part }
          $lines += "files: $((Get-ChildItem -LiteralPath $env:BUNDLE -Recurse -File -Force).Count)"
          $lines += 'largest R packages:'
          $lines += Get-ChildItem "$env:BUNDLE\R\library" -Directory | ForEach-Object { [pscustomobject]@{ MiB = Get-SizeMiB $_.FullName; Name = $_.Name } } | Sort-Object MiB -Descending | Select-Object -First 12 | ForEach-Object { "{0,6}  {1}" -f $_.MiB, $_.Name }
          $lines += '```'
          $lines | Tee-Object -FilePath "$env:OUT\sizes.txt" | Out-File -Append $env:GITHUB_STEP_SUMMARY
          New-Item -ItemType Directory -Force (Split-Path $env:MOVED) | Out-Null
          Move-Item -LiteralPath $env:BUNDLE -Destination $env:MOVED
          if (Test-Path $env:BUNDLE) { throw "the bundle is still at its build location" }

      - name: "Check: every bundled package loads (moved, reduced environment, network cut for the bundle's programs)"
        id: check
        if: ${{ !cancelled() && steps.move.outcome == 'success' }}
        run: |
          Set-NetFirewallProfile -All -Enabled True
          $programs = Get-ChildItem -LiteralPath $env:MOVED -Recurse -File -Filter *.exe
          foreach ($program in $programs) {
            New-NetFirewallRule -DisplayName "kit-134 block $($program.FullName)" -Direction Outbound -Action Block -Program $program.FullName | Out-Null
          }
          "outbound traffic blocked for the bundle's $($programs.Count) programs"
          pwsh -NoProfile -File packaging\verify\windows-clean-run.ps1 -Bundle $env:MOVED -Script packaging\verify\check-library.R -Arguments offline *>&1 | Tee-Object -FilePath "$env:OUT\check-library.log"
          if ($LASTEXITCODE -ne 0) { throw "the library check failed" }

      # ------------------------------------- token run (stage internal): verified in this job
      - name: "Check: the internal packages that built, from the moved folder (reduced environment, network cut)"
        if: ${{ !cancelled() && needs.plan.outputs.internal == 'true' && steps.move.outcome == 'success' }}
        run: |
          pwsh -NoProfile -File packaging\verify\windows-clean-run.ps1 -Bundle $env:MOVED -Script packaging\verify\check-internal.R -Arguments attempt *>&1 | Tee-Object -FilePath "$env:OUT\check-internal.log"
          if ($LASTEXITCODE -ne 0) { throw "the internal-package check failed" }

      # P6 (D4: no DIA on Windows): the lanes without DIA, in process with the bundle's R in the shell's environment.
      - name: "Lanes: the GUI-entry lanes without DIA against the bundle (moved, reduced environment, network cut)"
        if: ${{ !cancelled() && needs.plan.outputs.internal == 'true' && steps.testtools.outcome == 'success' && steps.check.outcome == 'success' }}
        timeout-minutes: 90
        run: |
          New-Item -ItemType Directory -Force "$env:OUT\lanes" | Out-Null
          & packaging\verify\windows-clean-run.ps1 -Bundle $env:MOVED -Script packaging\verify\run-lanes.R -NoBundleArgument -Arguments $env:GITHUB_WORKSPACE, $env:TEST_TOOLS, "$env:OUT\lanes", prot_tmt, prot_lfq, prot_lfq_fragpipe, metab_lc, metab_gc, metab_combined, lipid_canonical, trx_screen *>&1 | Tee-Object -FilePath "$env:OUT\lanes.log"
          $status = $LASTEXITCODE
          $lines = @('### GUI-entry lanes against the bundle, Windows (token run)', '```')
          if (Test-Path "$env:OUT\lanes\lane-summary.tsv") { $lines += Get-Content "$env:OUT\lanes\lane-summary.tsv" }
          $lines += '```'
          $lines | Out-File -Append $env:GITHUB_STEP_SUMMARY
          if ($status -ne 0) { throw "the lanes did not pass (exit $status)" }

      - name: "e2e lanes: the four browser lanes without DIA against the bundle's installed package (moved, reduced environment, network cut)"
        if: ${{ !cancelled() && needs.plan.outputs.internal == 'true' && steps.testtools.outcome == 'success' && steps.check.outcome == 'success' }}
        timeout-minutes: 120
        run: |
          New-Item -ItemType Directory -Force "$env:OUT\e2e" | Out-Null
          & packaging\verify\windows-clean-run.ps1 -Bundle $env:MOVED -Script packaging\verify\run-e2e.R -NoBundleArgument -Arguments $env:GITHUB_WORKSPACE, $env:TEST_TOOLS, "$env:OUT\e2e", lipidomics-canonical, metabolomics-lc-gc, transcriptomics-screen, proteomics-tmt-lfq *>&1 | Tee-Object -FilePath "$env:OUT\e2e.log"
          $status = $LASTEXITCODE
          $lines = @('### Browser e2e lanes against the bundle, Windows (token run)', '```')
          if (Test-Path "$env:OUT\e2e\e2e-summary.tsv") { $lines += Get-Content "$env:OUT\e2e\e2e-summary.tsv" }
          $lines += '```'
          $lines | Out-File -Append $env:GITHUB_STEP_SUMMARY
          if ($status -ne 0) { throw "the e2e lanes did not pass (exit $status)" }

      - name: "Summary for upload: small text files only (token run)"
        id: summary
        if: ${{ !cancelled() && needs.plan.outputs.internal == 'true' }}
        run: |
          $summary = Join-Path $env:RUNNER_TEMP 'summary'
          New-Item -ItemType Directory -Force $summary | Out-Null
          # install-library.log is not uploaded from a token run.
          foreach ($name in 'plan-packages.tsv', 'internal-packages.tsv', 'bundle-sources.tsv', 'version-table.tsv',
              'version-table.md', 'version-table.log', 'python-packages.txt', 'sizes.txt', 'check-library.log', 'check-internal.log',
              'test-tools.log', 'lanes.log', 'lanes\lane-summary.tsv', 'lanes\lane-differences.tsv', 'lanes\lane-failures.tsv',
              'e2e.log', 'e2e\e2e-summary.tsv', 'e2e\e2e-failures.tsv') {
            $file = Join-Path $env:OUT $name
            if (Test-Path -LiteralPath $file) { Copy-Item -LiteralPath $file $summary }
          }
          foreach ($file in Get-ChildItem -LiteralPath $summary -File) {
            $bytes = [IO.File]::ReadAllBytes($file.FullName)
            if ($file.Length -gt 20MB -or [Array]::IndexOf($bytes, [byte]0) -ge 0) { throw "$($file.Name) is not a small text file; nothing is uploaded" }
          }
          Get-ChildItem -LiteralPath $summary | Format-Table Name, Length

      - name: Upload the summary (text only; token run)
        if: ${{ !cancelled() && needs.plan.outputs.internal == 'true' && steps.summary.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: windows-internal-summary
          path: ${{ runner.temp }}/summary
          retention-days: 14

      # ---------------------------------------- D5: a clean Windows (stage container)
      - name: "D5: the bundle's R in a Windows Server Core container (network off)"
        if: needs.plan.outputs.container == 'true' && steps.check.outcome == 'success'
        run: |
          docker version
          $image = 'mcr.microsoft.com/windows/servercore:ltsc2025'
          $clock = [Diagnostics.Stopwatch]::StartNew()
          docker pull -q $image
          "pulled $image in $([math]::Round($clock.Elapsed.TotalSeconds)) s"
          $checks = Join-Path $env:RUNNER_TEMP 'container-checks'
          New-Item -ItemType Directory -Force $checks | Out-Null
          Copy-Item packaging\verify\check-library.R, packaging\verify\windows-clean-run.ps1, packaging\electron\entry.R $checks
          # The application answers HTTP 200 inside the container: the shell's entry with the shell's
          # environment for R (packaging/electron/main.js, rEnvironment); no window there.
          @'
          $bundle = 'C:\msr'
          Get-ChildItem Env: | Where-Object { $_.Name -match '^(RHOME|R_.*|RTOOLS.*|RETICULATE_.*|PYTHON.*)$' } | ForEach-Object { Remove-Item "Env:$($_.Name)" }
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot;$env:SystemRoot\System32\WindowsPowerShell\v1.0"
          $env:R_LIBS_USER = "$bundle\R\no-user-library"; $env:R_LIBS_SITE = "$bundle\R\no-site-library"
          $env:RTOOLS45_HOME = "$bundle\no-rtools"; $env:RETICULATE_PYTHON = "$bundle\python\python.exe"; $env:PYTHONNOUSERSITE = '1'
          $env:RSTUDIO_PANDOC = "$bundle\pandoc"; $env:MULTISCHOLAR_DISABLE_TOOLS = 'bash,dd,sha256sum,sync,tar,cp'; $env:MSR_BUNDLE = $bundle
          $run = 'C:\Users\ContainerAdministrator\msr-run'; New-Item -ItemType Directory -Force $run | Out-Null
          $r = Start-Process -FilePath "$bundle\R\bin\Rscript.exe" -ArgumentList '--vanilla', 'C:\checks\entry.R', '8765', $run, "$PID" -PassThru -NoNewWindow -RedirectStandardOutput "$run\r.out" -RedirectStandardError "$run\r.err"
          $status = $null
          for ($waited = 0; $waited -lt 300 -and -not $status -and -not $r.HasExited; $waited += 2) {
            Start-Sleep -Seconds 2
            try { $status = (Invoke-WebRequest -UseBasicParsing -TimeoutSec 5 'http://127.0.0.1:8765/').StatusCode } catch { }
          }
          "HTTP status after about $waited s: $status"
          Get-Content "$run\r.out" -ErrorAction SilentlyContinue | Select-Object -First 5
          if ($status -ne 200) { Get-Content "$run\r.err" -ErrorAction SilentlyContinue | Select-Object -Last 40 }
          & taskkill.exe /PID $r.Id /T /F | Out-Null
          if ($status -eq 200) { 'KIT-134 CHECK PASSED: the application answers HTTP 200 in Server Core'; exit 0 } else { exit 1 }
          '@ | Set-Content -Encoding UTF8 (Join-Path $checks 'serve.ps1')
          $mounts = @('-v', "${env:MOVED}:C:\msr:ro", '-v', "${checks}:C:\checks:ro")
          docker run --rm --network none @mounts $image powershell -NoProfile -ExecutionPolicy Bypass -File C:\checks\windows-clean-run.ps1 -Bundle C:\msr -Script C:\checks\check-library.R -Arguments offline *>&1 | Tee-Object -FilePath "$env:OUT\container-check-library.log"
          $libraryStatus = $LASTEXITCODE
          docker run --rm --network none @mounts $image powershell -NoProfile -ExecutionPolicy Bypass -File C:\checks\serve.ps1 *>&1 | Tee-Object -FilePath "$env:OUT\container-serve.log"
          $serveStatus = $LASTEXITCODE
          "library check: exit $libraryStatus; application: exit $serveStatus"
          if ($libraryStatus -ne 0 -or $serveStatus -ne 0) { throw "the Server Core container check failed" }

      # ------------------------------------------------ P3: the shell (stage shell and later)
      - uses: actions/setup-node@v4
        if: needs.plan.outputs.shell == 'true' && steps.check.outcome == 'success'
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Version stamp and third-party notices
        id: stamp
        if: needs.plan.outputs.shell == 'true' && steps.check.outcome == 'success'
        run: |
          $version = (Select-String -Path DESCRIPTION -Pattern '^Version:\s*(.+)$').Matches[0].Groups[1].Value.Trim()
          $packageVersion = node -p "require('./packaging/electron/package.json').version"
          if ($packageVersion -ne $version) { throw "package.json has $packageVersion, DESCRIPTION $version" }
          $electron = node -p "require('./packaging/electron/package-lock.json').packages['node_modules/electron'].version"
          & "$env:MOVED\R\bin\Rscript.exe" --vanilla packaging\r\notices.R $env:MOVED . "$env:OUT\bundle-sources.tsv" packaging\electron\stamp $electron *>&1 | Tee-Object -FilePath "$env:OUT\notices.log"
          if ($LASTEXITCODE -ne 0) { throw "notices failed" }
          Copy-Item packaging\electron\stamp\VERSION.json, packaging\electron\stamp\THIRD-PARTY-NOTICES.txt, packaging\electron\stamp\sources-list.tsv $env:OUT
          "VERSION=$version" >> $env:GITHUB_ENV

      - name: The Electron shell, and from stage installer the NSIS per-user installer
        id: electron
        if: needs.plan.outputs.shell == 'true' && steps.stamp.outcome == 'success'
        working-directory: packaging/electron
        run: |
          New-Item -ItemType Directory -Force build | Out-Null
          Copy-Item ..\..\inst\shiny\www\MultiScholaR.png build\icon.png
          Move-Item -LiteralPath $env:MOVED -Destination runtime
          npm ci --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw "npm ci failed" }
          $target = if ('${{ needs.plan.outputs.installer }}' -eq 'true') { 'nsis' } else { 'dir' }
          $clock = [Diagnostics.Stopwatch]::StartNew()
          npx electron-builder --win $target --publish never
          if ($LASTEXITCODE -ne 0) { throw "electron-builder failed" }
          "electron-builder --win ${target}: $([math]::Round($clock.Elapsed.TotalSeconds)) s" | Tee-Object -FilePath "$env:OUT\electron-builder.txt"
          Get-ChildItem dist | Format-Table Name, Length

      - name: "P4: path lengths under the application folder (limit 170)"
        if: needs.plan.outputs.shell == 'true' && steps.electron.outcome == 'success'
        continue-on-error: ${{ needs.plan.outputs.installer != 'true' }}
        run: |
          pwsh -NoProfile -File packaging\windows\assemble.ps1 -Action pathlength -Folder packaging\electron\dist\win-unpacked -Limit 170 *>&1 | Tee-Object -FilePath "$env:OUT\path-lengths.txt"
          if ($LASTEXITCODE -ne 0) { throw "a path is too long" }

      - name: "P3 lifecycle: the unpacked application on the build runner (network cut for its programs)"
        if: needs.plan.outputs.shell == 'true' && steps.electron.outcome == 'success'
        run: |
          $app = (Resolve-Path packaging\electron\dist\win-unpacked).Path
          $programs = Get-ChildItem -LiteralPath $app -Recurse -File -Filter *.exe
          foreach ($program in $programs) {
            New-NetFirewallRule -DisplayName "kit-134 block $($program.FullName)" -Direction Outbound -Action Block -Program $program.FullName | Out-Null
          }
          "outbound traffic blocked for the application's $($programs.Count) programs"
          node packaging\electron\lifecycle-test.js "Windows, unpacked, windows-2025 build runner" "$app\MultiScholaR.exe" $app --expect-launcher process *>&1 | Tee-Object -FilePath "$env:OUT\lifecycle-build-runner.log"
          if ($LASTEXITCODE -ne 0) { throw "the lifecycle test failed" }

      - name: The installer's size and checksum
        id: installer
        if: needs.plan.outputs.installer == 'true' && steps.electron.outcome == 'success'
        run: |
          $setup = Get-Item packaging\electron\dist\MultiScholaR-Setup-*.exe
          $hash = (Get-FileHash -Algorithm SHA256 $setup.FullName).Hash.ToLower()
          "$hash  $($setup.Name)" | Set-Content "$($setup.FullName).sha256"
          $lines = @('### Windows NSIS installer', '```', "$($setup.Name): $($setup.Length) bytes ($([math]::Round($setup.Length / 1MB)) MiB)", "sha256 $hash", '```')
          $lines | Set-Content "$env:OUT\installer.txt"
          $lines | Out-File -Append $env:GITHUB_STEP_SUMMARY
          $lines

      - name: Upload the NSIS installer
        if: needs.plan.outputs.installer == 'true' && needs.plan.outputs.internal != 'true' && steps.installer.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            packaging/electron/dist/MultiScholaR-Setup-*.exe
            packaging/electron/dist/MultiScholaR-Setup-*.exe.sha256
          compression-level: 0
          retention-days: 14
          if-no-files-found: error

      - name: Keep the evidence (text only; not in a token run, which uploads its summary instead)
        if: ${{ !cancelled() && needs.plan.outputs.internal != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: windows-build-evidence
          path: |
            ${{ runner.temp }}/evidence
            !${{ runner.temp }}/evidence/github-sources
          retention-days: 14

  windows-install:
    name: "Windows: per-user install and lifecycle on a fresh windows-2025 (network cut)"
    needs: [plan, windows-build]
    if: ${{ !cancelled() && needs.plan.outputs.installer == 'true' && needs.windows-build.result == 'success' }}
    runs-on: windows-2025
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    steps:
      # The whole tree: the report check below runs GUI-entry lanes from tests/ (their helpers read other
      # folders of the source tree); the package they test is the installed application's.
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: ${{ runner.temp }}\installer
      - name: Silent per-user install
        id: install
        run: |
          $setup = Get-Item "$env:RUNNER_TEMP\installer\MultiScholaR-Setup-*.exe"
          $expected = (Get-Content "$($setup.FullName).sha256").Split(' ')[0]
          if ((Get-FileHash -Algorithm SHA256 $setup.FullName).Hash.ToLower() -ne $expected) { throw "checksum mismatch" }
          "installer: $($setup.Name), $($setup.Length) bytes"
          "runner's own R on the PATH: $((Get-Command Rscript.exe -ErrorAction SilentlyContinue).Source)"
          $clock = [Diagnostics.Stopwatch]::StartNew()
          $process = Start-Process -FilePath $setup.FullName -ArgumentList '/S' -Wait -PassThru
          $seconds = [math]::Round($clock.Elapsed.TotalSeconds)
          $application = $null
          for ($waited = 0; -not $application -and $waited -lt 120; $waited += 5) {
            $application = Get-ChildItem "$env:LOCALAPPDATA\Programs" -Recurse -Depth 2 -Filter MultiScholaR.exe -ErrorAction SilentlyContinue | Select-Object -First 1
            if (-not $application) { Start-Sleep -Seconds 5 }
          }
          if (-not $application) { throw "MultiScholaR.exe was not installed under $env:LOCALAPPDATA\Programs" }
          $folder = $application.Directory.FullName
          $files = Get-ChildItem -LiteralPath $folder -Recurse -File -Force
          $shortcut = Get-ChildItem "$env:APPDATA\Microsoft\Windows\Start Menu\Programs" -Recurse -Filter 'MultiScholaR*.lnk' -ErrorAction SilentlyContinue | Select-Object -First 1
          $lines = @('### Windows install on a fresh windows-2025', '```',
            "silent install: exit $($process.ExitCode) after $seconds s",
            "installed per user at: $folder",
            "installed size: $([math]::Round(($files | Measure-Object Length -Sum).Sum / 1MB)) MiB in $($files.Count) files",
            "longest installed path: $(($files | ForEach-Object { $_.FullName.Length } | Measure-Object -Maximum).Maximum) characters",
            "Start-menu shortcut: $($shortcut.FullName)", '```')
          $lines | Out-File -Append $env:GITHUB_STEP_SUMMARY
          $lines
          if (-not $shortcut) { throw "no Start-menu shortcut" }
          "APP=$($application.FullName)" >> $env:GITHUB_ENV
          "APP_FOLDER=$folder" >> $env:GITHUB_ENV
      # W1 (outcome.md): the Summary report from the installed application with no browser to be found.
      # The test tools are fetched before the lifecycle step cuts the network for the application's programs.
      - name: "Report check: test tools from the snapshot, in a separate library (installed application's R)"
        id: testtools
        run: |
          "TEST_TOOLS=$env:RUNNER_TEMP\test-tools" >> $env:GITHUB_ENV
          $date = (Get-Content packaging\multischolar.lock.json -Raw | ConvertFrom-Json).Snapshot.Date
          & packaging\verify\windows-clean-run.ps1 -Bundle "$env:APP_FOLDER\resources\runtime" -Script packaging\verify\test-tools.R -NoBundleArgument -Arguments "$env:RUNNER_TEMP\test-tools", $date
          if ($LASTEXITCODE -ne 0) { throw "the test tools were not installed" }
      - name: "P3 lifecycle: the installed application (network cut for its programs)"
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          Set-NetFirewallProfile -All -Enabled True
          $programs = Get-ChildItem -LiteralPath $env:APP_FOLDER -Recurse -File -Filter *.exe
          foreach ($program in $programs) {
            New-NetFirewallRule -DisplayName "kit-134 block $($program.FullName)" -Direction Outbound -Action Block -Program $program.FullName | Out-Null
          }
          "outbound traffic blocked for the installed application's $($programs.Count) programs"
          node packaging\electron\lifecycle-test.js "Windows, installed per user, fresh windows-2025" $env:APP $env:APP_FOLDER --expect-launcher process
          if ($LASTEXITCODE -ne 0) { throw "the lifecycle test failed" }
      - name: "Report check: a Summary report renders to .docx with every Chrome-type browser hidden (lipidomics and metabolomics entry lanes, network cut)"
        if: ${{ !cancelled() && steps.testtools.outcome == 'success' }}
        timeout-minutes: 40
        run: |
          # R runs in the shell's environment (windows-clean-run.ps1: PATH is System32, the Windows folder and
          # Windows PowerShell's), so no browser is on its PATH; chromote, which would otherwise find Chrome or
          # Edge through the registry, is pointed at a path that does not exist.
          foreach ($name in 'chrome.exe', 'msedge.exe', 'chromium.exe') {
            "on the runner's PATH, ${name}: $((Get-Command $name -ErrorAction SilentlyContinue).Source)"
          }
          foreach ($path in "$env:ProgramFiles\Google\Chrome\Application\chrome.exe", "${env:ProgramFiles(x86)}\Microsoft\Edge\Application\msedge.exe") {
            "installed on the runner, ${path}: $(Test-Path -LiteralPath $path)"
          }
          $env:CHROMOTE_CHROME = 'C:\no-browser\chrome.exe'
          $env:MSR_REPORT_CHECK = '1'
          $out = "$env:RUNNER_TEMP\report-lanes"
          New-Item -ItemType Directory -Force $out | Out-Null
          & packaging\verify\windows-clean-run.ps1 -Bundle "$env:APP_FOLDER\resources\runtime" -Script packaging\verify\run-lanes.R -NoBundleArgument -Arguments $env:GITHUB_WORKSPACE, $env:TEST_TOOLS, $out, lipid_canonical, metab_lc *>&1 | Tee-Object -FilePath "$out\report-lanes.log"
          $status = $LASTEXITCODE
          $lines = @('### Report check, Windows (installed application, no browser to be found)', '```')
          $lines += Select-String -Path "$out\report-lanes.log" -Pattern '^(BROWSERS|RENDER|REPORT|LANE|network|KIT-134)[ :]' | ForEach-Object Line
          $lines += '```'
          $lines | Out-File -Append $env:GITHUB_STEP_SUMMARY
          if ($status -ne 0) { throw "the report check failed (exit $status)" }
