name: "MOFA2 evidence k184 (integration enrichment, the removed RUV factors in the design of the test; the simulation)"

# Run-only lane (branch run-mofa-evidence-k184; KIT-184 section 6.2, methods ledger VAL-53 (1), VAL-58, VAL-62, VAL-97
# (3)). Copied from the KIT-183 lane (run-mofa-evidence-k183, .github/workflows/k183-evidence.yml): R 4.6.1, the KIT-134
# snapshot library with the internal packages built in the job and MultiScholaR at package_commit installed by the
# library action (ruv and RUVIIIC are among its dependencies; their versions are written to versions.tsv by the
# simulation), MOFA2's closure and the bundle's Python, R started through the bundle's launcher. The simulation is the
# package commit's docs/qa/workflow-execution/kit/kit-184/simulate-k184.R (this lane's .github/mofa-smoke/k184.R is a
# byte copy, checked); the scorer is score-k184.R of the same commit, with K184_SCORE=ruv.
#
# The jobs of each run are fixed here (declared), not taken from the parameters:
#   lifecycle    one job (L1): 5 replicates of each of cells A, B and D with every arm, class and factor; three replicates
#                of KIT-183's 12-sample cell through simulate-k184.R (blocks off) and through KIT-183's own
#                simulate-k183.R, whose tables must be identical (parity); one replicate with a declared invalid
#                argument (7 biological samples); then the scorer
#   blind        one job (L1b, the blind lifecycle extension; declaration audit K184-D05, re-check K184-R02): cell A
#                replicates 1 to 5, then cell D replicates 1 to 5, dealt as in the counted run, no replicate starting
#                later than 210 seconds after the simulate step starts; then cell A replicates 1 and 2 again (the
#                determinism pass), the scorer and its scale test, all inside the job. ONLY the staging folder filled
#                by name in the step "L1b" is uploaded; no score job runs; nothing is written to the step summary; no
#                rate is printed. The scorer's switch K184_BLIND alone would not do this: it still writes its tables.
#   counted      16 jobs of 125 replicates (S; cells A and B 800 each, replicates 6 to 805; cell D 400, replicates 6
#                to 405; each job 100 replicates of A or B and then 25 of D; 4 single-thread workers at a time) and the
#                determinism job (replicates 6 to 15 of cell A again), then the scorer in the score job. Replicates 1
#                to 5 of every cell were seen in the lifecycle runs and enter nothing.
#   S' (one correction of instrumentation) re-runs the affected jobs only (ticket section 11, revisions 1.5 and 1.7):
#   its job list is written into this file when it is needed; there is no standing `correction` run.
# Start: change .github/mofa-smoke/k184-params.json in a commit and push it to run-mofa-evidence-k184.
#   run             lifecycle | blind | counted
#   package_commit  40-digit commit of MultiScholaR under test
# Token rules (as the package lane): the token goes only to the library action; no cache of any kind; nothing built
# with it and no install or build output is uploaded (only the result tables under RUNNER_TEMP/result, or for a blind
# run the staging folder RUNNER_TEMP/staged, scanned first). Artifacts are kept 90 days (re-check K184-R03).

on:
  push:
    branches:
      - "run-mofa-evidence-k184"
    paths:
      - .github/mofa-smoke/k184-params.json
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: k184-evidence-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    name: Parameters
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.plan.outputs.commit }}
      run: ${{ steps.plan.outputs.run }}
      jobs: ${{ steps.plan.outputs.jobs }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/mofa-smoke
          persist-credentials: false
      - id: plan
        run: |
          p=.github/mofa-smoke/k184-params.json
          jq -e '(.run | IN("lifecycle", "blind", "counted")) and
            (.package_commit | type == "string" and test("^[0-9a-f]{40}$"))' "$p" > /dev/null \
            || { echo "::error::k184-params.json is not valid"; exit 1; }
          run="$(jq -r .run "$p")"
          if [ "$run" = lifecycle ]; then
            jobs='[{"id":"life","timeout":75,"segments":"ruv:A:1:5;ruv:B:1:5;ruv:D:1:5","extra":"parity ruvfail"}]'
          elif [ "$run" = blind ]; then
            jobs='[{"id":"lifeb","timeout":50,"segments":"ruv:A:1:5;ruv:D:1:5","extra":""}]'
          else
            jobs='[
              {"id":"s01","timeout":85,"segments":"ruv:A:6:105;ruv:D:6:30","extra":""},
              {"id":"s02","timeout":85,"segments":"ruv:A:106:205;ruv:D:31:55","extra":""},
              {"id":"s03","timeout":85,"segments":"ruv:A:206:305;ruv:D:56:80","extra":""},
              {"id":"s04","timeout":85,"segments":"ruv:A:306:405;ruv:D:81:105","extra":""},
              {"id":"s05","timeout":85,"segments":"ruv:A:406:505;ruv:D:106:130","extra":""},
              {"id":"s06","timeout":85,"segments":"ruv:A:506:605;ruv:D:131:155","extra":""},
              {"id":"s07","timeout":85,"segments":"ruv:A:606:705;ruv:D:156:180","extra":""},
              {"id":"s08","timeout":85,"segments":"ruv:A:706:805;ruv:D:181:205","extra":""},
              {"id":"s09","timeout":85,"segments":"ruv:B:6:105;ruv:D:206:230","extra":""},
              {"id":"s10","timeout":85,"segments":"ruv:B:106:205;ruv:D:231:255","extra":""},
              {"id":"s11","timeout":85,"segments":"ruv:B:206:305;ruv:D:256:280","extra":""},
              {"id":"s12","timeout":85,"segments":"ruv:B:306:405;ruv:D:281:305","extra":""},
              {"id":"s13","timeout":85,"segments":"ruv:B:406:505;ruv:D:306:330","extra":""},
              {"id":"s14","timeout":85,"segments":"ruv:B:506:605;ruv:D:331:355","extra":""},
              {"id":"s15","timeout":85,"segments":"ruv:B:606:705;ruv:D:356:380","extra":""},
              {"id":"s16","timeout":85,"segments":"ruv:B:706:805;ruv:D:381:405","extra":""},
              {"id":"det","timeout":25,"segments":"ruv:A:6:15","extra":""}]'
          fi
          {
            echo "commit=$(jq -r .package_commit "$p")"
            echo "run=$run"
            echo "jobs=$(echo "$jobs" | jq -c .)"
          } | tee -a "$GITHUB_OUTPUT"

  evidence:
    name: ${{ matrix.job.id }} (package ${{ needs.plan.outputs.commit }})
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        job: ${{ fromJSON(needs.plan.outputs.jobs) }}
    runs-on: ubuntu-22.04
    timeout-minutes: ${{ matrix.job.timeout }}
    steps:
      - name: Job start
        run: echo "JOB_STARTED=$(date +%s)" | tee -a "$GITHUB_ENV"

      - name: The package under test (package_commit)
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.commit }}
          persist-credentials: false
          lfs: false

      - name: This lane's scripts (the MOFA2 installer, the launcher, the Python build)
        uses: actions/checkout@v4
        with:
          path: lane
          persist-credentials: false

      - name: Versions from the distributable workflow; paths; the runner
        run: |
          for key in R_VERSION PBS_RELEASE PBS_PYTHON; do
            value="$(sed -n "s/^  $key: \"\(.*\)\"$/\1/p" lane/.github/workflows/distributable.yml)"
            test -n "$value" || { echo "::error::$key not found in distributable.yml"; exit 1; }
            echo "$key=$value" | tee -a "$GITHUB_ENV"
          done
          {
            echo "BUNDLE=$RUNNER_TEMP/bundle"
            echo "OUT=$RUNNER_TEMP/evidence"
            echo "RES=$RUNNER_TEMP/result"
          } >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/evidence" "$RUNNER_TEMP/result"
          {
            echo "image: ${ImageOS:-?} ${ImageVersion:-?}"
            nproc
            grep -E '^(MemTotal)' /proc/meminfo
            lscpu | grep -E '^(Model name|Vendor ID|CPU\(s\))'
          } | tee "$RUNNER_TEMP/result/runner.txt"
          sim=docs/qa/workflow-execution/kit/kit-184/simulate-k184.R
          test -f "$sim" || { echo "::error::$sim is not in the package commit"; exit 1; }
          cmp "$sim" lane/.github/mofa-smoke/k184.R || { echo "::error::the lane's k184.R is not a copy of $sim"; exit 1; }
          sha256sum "$sim" docs/qa/workflow-execution/kit/kit-184/score-k184.R \
            docs/qa/workflow-execution/kit/kit-183/simulate-k183.R docs/qa/workflow-execution/kit/kit-183/score-k183.R \
            lane/.github/workflows/k184-evidence.yml | tee "$RUNNER_TEMP/result/script-sha256.txt"

      - name: R 4.6.1, the KIT-134 library, the internal packages and MultiScholaR at package_commit (no cache)
        uses: ./.github/actions/snapshot-library
        with:
          token: ${{ secrets.DEPS_READ_TOKEN }}
          extra-packages: ""

      - name: MOFA2's closure from the snapshot (plan, system libraries, install; versions against the bundle's)
        run: |
          set -o pipefail
          R_LIBS="$MSR_TOOLS_LIB" /opt/R/4.6.1/bin/Rscript --vanilla lane/.github/mofa-smoke/install-mofa-library.R plan lane "$OUT"
          (cd lane && bash packaging/linux/build.sh sysreqs)
          R_LIBS="$MSR_TOOLS_LIB" /opt/R/4.6.1/bin/Rscript --vanilla lane/.github/mofa-smoke/install-mofa-library.R install lane "$OUT" \
            2>&1 | tee "$OUT/install-mofa-library.log" | { grep -vE '^(\* |trying URL|Content type|downloaded|=+$)' || true; } | tail -n 40
          cp "$OUT/mofa-library-versions.tsv" "$RES/"

      - name: The bundle's Python (packaging/linux/build.sh python; hashes checked)
        run: |
          (cd lane && bash packaging/linux/build.sh python)
          cp "$OUT/python-packages.txt" "$RES/"

      - name: Bundle-shaped folder for the launcher (bin/Rscript = packaging/linux/Rscript, R -> the R home)
        run: |
          mkdir -p "$BUNDLE/bin"
          install -m 0755 lane/packaging/linux/Rscript "$BUNDLE/bin/Rscript"
          ln -s "/opt/R/$R_VERSION/lib/R" "$BUNDLE/R"

      - name: Simulate (${{ matrix.job.id }})
        env:
          SEGMENTS: ${{ matrix.job.segments }}
          EXTRA: ${{ matrix.job.extra }}
          TIMEOUT_MIN: ${{ matrix.job.timeout }}
          RUN_KIND: ${{ needs.plan.outputs.run }}
        run: |
          set -o pipefail
          export OPENBLAS_NUM_THREADS=1 OMP_NUM_THREADS=1 MKL_NUM_THREADS=1 NUMEXPR_NUM_THREADS=1
          # No replicate starts after this time (6 minutes before the job's limit, so the results are uploaded).
          export K184_DEADLINE=$((JOB_STARTED + (TIMEOUT_MIN - 6) * 60))
          # L1b only: 210 seconds after this step starts, whatever the set-up took, so that the last cell D replicates
          # are recorded as not started while every cell A replicate has started (re-check K184-R02).
          if [ "$RUN_KIND" = blind ]; then export K184_DEADLINE=$(( $(date +%s) + 210 )); fi
          export K183_DEADLINE="$K184_DEADLINE"
          sim="$GITHUB_WORKSPACE/docs/qa/workflow-execution/kit/kit-184/simulate-k184.R"
          sim183="$GITHUB_WORKSPACE/docs/qa/workflow-execution/kit/kit-183/simulate-k183.R"
          echo "setup took $(( $(date +%s) - JOB_STARTED )) s; deadline $(date -d "@$K184_DEADLINE" -u +%H:%M:%SZ)" | tee "$RES/plan.txt"
          # Four single-thread workers: each segment's replicates (ruv:<cell>:<first>:<last>) dealt into four contiguous
          # ranges.
          workers=()
          IFS=';' read -ra segs <<< "$SEGMENTS"
          for seg in "${segs[@]}"; do
            IFS=':' read -r task cell first last <<< "$seg"
            count=$((last - first + 1))
            parts=4; [ "$count" -lt 4 ] && parts="$count"
            for ((i = 0; i < parts; i++)); do
              a=$((first + i * count / parts)); b=$((first + (i + 1) * count / parts - 1))
              workers+=("$task:$cell:$a:$b")
            done
          done
          echo "workers: ${workers[*]}" | tee -a "$RES/plan.txt"
          # At most four workers at a time.
          i=0
          for w in "${workers[@]}"; do
            i=$((i + 1))
            IFS=':' read -r task cell a b <<< "$w"
            ( "$BUNDLE/bin/Rscript" --vanilla "$sim" "$RES/w$i" "$task" "$cell" "$a" "$b" > "$RES/w$i.log" 2>&1
              echo "worker $i ($w) exit $?" >> "$RES/plan.txt" ) &
            while [ "$(jobs -rp | wc -l)" -ge 4 ]; do wait -n; done
          done
          wait
          for x in $EXTRA; do
            case "$x" in
              parity)
                # KIT-183's 12-sample cell, replicates 1 to 3, through this ticket's file (its blocks off) and through
                # KIT-183's own file: every table identical (the status table but for its seconds).
                ( "$BUNDLE/bin/Rscript" --vanilla "$sim" "$RES/parity/k184" replicates 12 1 3 > "$RES/parity-k184.log" 2>&1 ) &
                ( "$BUNDLE/bin/Rscript" --vanilla "$sim183" "$RES/parity/k183" replicates 12 1 3 > "$RES/parity-k183.log" 2>&1 ) &
                wait
                : > "$RES/parity.txt"
                same=true
                for f in "$RES"/parity/k183/*.tsv; do
                  name="$(basename "$f")"
                  if [ "$name" = status.tsv ]; then
                    cmp -s <(cut -f1-5 "$f") <(cut -f1-5 "$RES/parity/k184/$name") && verdict=identical || verdict=DIFFERENT
                  else
                    cmp -s "$f" "$RES/parity/k184/$name" && verdict=identical || verdict=DIFFERENT
                  fi
                  [ "$verdict" = identical ] || same=false
                  echo "$name $verdict" >> "$RES/parity.txt"
                done
                [ "$(ls "$RES"/parity/k183/*.tsv | wc -l)" = "$(ls "$RES"/parity/k184/*.tsv | wc -l)" ] || same=false
                echo "tables $(ls "$RES"/parity/k183/*.tsv | wc -l) and $(ls "$RES"/parity/k184/*.tsv | wc -l); completed $(grep -c completed "$RES/parity/k183/status.tsv") and $(grep -c completed "$RES/parity/k184/status.tsv"); parity $same" >> "$RES/parity.txt"
                cat "$RES/parity.txt"
                ;;
              ruvfail) "$BUNDLE/bin/Rscript" --vanilla "$sim" "$RES/extra" ruvfail > "$RES/fail.log" 2>&1 ;;
            esac
            echo "$x exit $?" >> "$RES/plan.txt"
          done
          echo "simulation done after $(( $(date +%s) - JOB_STARTED )) s" | tee -a "$RES/plan.txt"
          cat "$RES"/w*/status.tsv 2>/dev/null | awk -F'\t' 'NR > 1 && $1 != "cell" { s[$3]++ } END { for (k in s) print k, s[k] }' \
            | tee -a "$RES/plan.txt"

      - name: "L1b: the determinism pass, the scorer, the scale test; the staging folder filled by name"
        if: ${{ needs.plan.outputs.run == 'blind' }}
        run: |
          set -o pipefail
          export OPENBLAS_NUM_THREADS=1 OMP_NUM_THREADS=1 MKL_NUM_THREADS=1 NUMEXPR_NUM_THREADS=1
          kit="$GITHUB_WORKSPACE/docs/qa/workflow-execution/kit/kit-184"
          sim="$kit/simulate-k184.R"
          scorer="$kit/score-k184.R"
          rscript="/opt/R/$R_VERSION/bin/Rscript"
          JOBS="$RUNNER_TEMP/jobs"; SCORE="$RUNNER_TEMP/score"; SCALE="$RUNNER_TEMP/scale"; STAGED="$RUNNER_TEMP/staged"
          mkdir -p "$JOBS/k184-det" "$SCORE" "$SCALE/k184-scale" "$STAGED"
          ln -s "$RES" "$JOBS/k184-lifeb"
          tables="caught counts errors exact factors feature floor formed identity orientation power status versions"
          # Only R's error message of a failed scorer is printed (no result is ever written to its standard error).
          errorLines() { grep -A 4 '^Error' "$1" | head -n 12 || true; }

          # (2) The determinism pass: cell A replicates 1 and 2 again, no deadline, into a folder named k184-det.
          for r in 1 2; do
            ( "$BUNDLE/bin/Rscript" --vanilla "$sim" "$JOBS/k184-det/w$r" ruv A "$r" "$r" > "$JOBS/k184-det/w$r.log" 2>&1
              echo "determinism worker $r (ruv:A:$r:$r) exit $?" >> "$RES/plan.txt" ) &
          done
          wait

          # (3) The scorer, blind: its output folder is never uploaded and its summary is not printed.
          score_status=0
          K184_SCORE=ruv K184_BLIND=1 K184_DETERMINISM_SELFTEST=1 K184_L1_REFERENCE="$kit/l1/error-rates.tsv" \
            "$rscript" --vanilla "$scorer" "$JOBS" "$SCORE" > "$RUNNER_TEMP/score.log" 2>&1 || score_status=$?
          echo "scorer exit $score_status" | tee -a "$RES/plan.txt"
          [ "$score_status" -eq 0 ] || errorLines "$RUNNER_TEMP/score.log"

          # (4) The scale test: the counted workers' tables copied 250 times with the replicate number shifted by 10
          # per copy (one worker folder per copy, as the counted run has many), the determinism folder as it is; scored
          # blind under a limit of 25 minutes; its output deleted; kept: wall seconds, peak resident memory, exit status.
          copies=250
          for table in $tables; do
            awk 'FNR == 1 && NR != 1 { next } { print }' "$RES"/w*/"$table".tsv > "$RUNNER_TEMP/one-$table.tsv" 2> /dev/null || true
          done
          for ((j = 0; j < copies; j++)); do
            d="$SCALE/k184-scale/w$j"
            mkdir -p "$d"
            for table in $tables; do
              f="$RUNNER_TEMP/one-$table.tsv"
              [ -s "$f" ] || continue
              if [ "$table" = versions ]; then
                cp "$f" "$d/$table.tsv"
              else
                awk -F'\t' -v OFS='\t' -v add="$((10 * j))" 'NR > 1 { $2 += add } { print }' "$f" > "$d/$table.tsv"
              fi
            done
          done
          mkdir -p "$SCALE/k184-det"
          for r in 1 2; do [ -d "$JOBS/k184-det/w$r" ] && cp -r "$JOBS/k184-det/w$r" "$SCALE/k184-det/"; done
          scale_replicates=$( { cat "$SCALE"/k184-scale/w*/status.tsv 2> /dev/null || true; } | awk -F'\t' '$3 == "completed"' | wc -l)
          scale_rows=$( { cat "$SCALE"/k184-scale/w*/errors.tsv 2> /dev/null || true; } | wc -l)
          scale_status=0
          scale_started=$(date +%s)
          if [ -x /usr/bin/time ]; then
            /usr/bin/time -f '%M' -o "$RUNNER_TEMP/scale-peak.txt" timeout 25m env K184_SCORE=ruv K184_BLIND=1 \
              "$rscript" --vanilla "$scorer" "$SCALE" "$RUNNER_TEMP/scale-out" > "$RUNNER_TEMP/scale.log" 2>&1 || scale_status=$?
            scale_peak="$(tail -n 1 "$RUNNER_TEMP/scale-peak.txt")"
          else
            # No GNU time on the image: the same figure (the largest resident set of a waited-for child) from Python.
            python3 -c 'import resource, subprocess, sys; code = subprocess.call(sys.argv[2:]); open(sys.argv[1], "w").write(str(resource.getrusage(resource.RUSAGE_CHILDREN).ru_maxrss) + "\n"); sys.exit(code)' \
              "$RUNNER_TEMP/scale-peak.txt" timeout 25m env K184_SCORE=ruv K184_BLIND=1 \
              "$rscript" --vanilla "$scorer" "$SCALE" "$RUNNER_TEMP/scale-out" > "$RUNNER_TEMP/scale.log" 2>&1 || scale_status=$?
            scale_peak="$(tail -n 1 "$RUNNER_TEMP/scale-peak.txt" 2> /dev/null || echo "not measured")"
          fi
          scale_seconds=$(( $(date +%s) - scale_started ))
          rm -rf "$RUNNER_TEMP/scale-out"
          echo "scale test: $copies copies; completed replicates $scale_replicates; error-table lines $scale_rows; wall seconds $scale_seconds; peak resident KiB $scale_peak; exit status $scale_status (124 = stopped at 25 minutes)" \
            | tee "$STAGED/scale-test.txt"
          [ "$scale_status" -eq 0 ] || errorLines "$RUNNER_TEMP/scale.log"

          # (5) The staging folder, filled by name. Nothing else of this job is uploaded.
          cp "$RES/runner.txt" "$RES/script-sha256.txt" "$STAGED/"
          awk 'FNR == 1 && NR != 1 { next } { print }' "$RES"/w*/status.tsv > "$STAGED/status.tsv"
          awk 'FNR == 1 && NR != 1 { next } { print }' "$RES"/w*/formed.tsv > "$STAGED/formed.tsv"
          for name in completion not-completed pools versions determinism determinism-selftest l1-reference-check; do
            if [ -f "$SCORE/$name.tsv" ]; then cp "$SCORE/$name.tsv" "$STAGED/"; fi
          done
          for f in "$RES"/w*.log; do cp "$f" "$STAGED/"; done
          for f in "$JOBS"/k184-det/w*.log; do cp "$f" "$STAGED/det-$(basename "$f")"; done
          {
            printf 'table\trows\trows_by_cell\tcolumns\tsha256\n'
            for f in "$RES"/w*/*.tsv "$JOBS"/k184-det/w*/*.tsv "$SCORE"/*.tsv; do
              [ -f "$f" ] || continue
              case "$f" in
                "$SCORE"/*) name="score/$(basename "$f")" ;;
                "$JOBS"/k184-det/*) name="det/$(basename "$(dirname "$f")")/$(basename "$f")" ;;
                *) name="$(basename "$(dirname "$f")")/$(basename "$f")" ;;
              esac
              rows=$(( $(wc -l < "$f") - 1 ))
              by_cell="$(awk -F'\t' 'NR == 1 { if ($1 != "cell") exit; next } { n[$1]++ } END { s = ""; for (k in n) s = s (s == "" ? "" : ";") k "=" n[k]; print s }' "$f")"
              printf '%s\t%s\t%s\t%s\t%s\n' "$name" "$rows" "$by_cell" "$(head -n 1 "$f" | tr '\t' ',')" "$(sha256sum "$f" | cut -d' ' -f1)"
            done
          } > "$STAGED/tables.tsv"
          echo "L1b steps done after $(( $(date +%s) - JOB_STARTED )) s" >> "$RES/plan.txt"
          cp "$RES/plan.txt" "$STAGED/"
          echo "staged files:"
          ls -1 "$STAGED"
          [ "$score_status" -eq 0 ] && [ "$scale_status" -eq 0 ]

      - name: Nothing token-like in the upload; files naming the internal packages withheld
        if: ${{ !cancelled() }}
        env:
          RUN_KIND: ${{ needs.plan.outputs.run }}
        run: |
          target="$RES"
          if [ "$RUN_KIND" = blind ]; then target="$RUNNER_TEMP/staged"; mkdir -p "$target"; fi
          if grep -rlE 'ghp_|github_pat_|gho_|Bearer ' "$target"; then
            echo "::error::token-like text in the result"; exit 1
          fi
          grep -rlE 'fast_duckdb|fast_limpa_dpc|fastduckdb|fastlimpadpc' "$target" | while read -r f; do
            rm -f "$f"; echo "withheld: ${f#"$target"/}" | tee -a "$target/withheld.txt"
          done
          du -sh "$target"

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && needs.plan.outputs.run != 'blind' }}
        with:
          name: k184-${{ matrix.job.id }}
          path: ${{ runner.temp }}/result
          retention-days: 90

      - name: "L1b: only the staging folder leaves the job"
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && needs.plan.outputs.run == 'blind' }}
        with:
          name: k184-${{ matrix.job.id }}-staged
          path: ${{ runner.temp }}/staged
          retention-days: 90

  score:
    name: Score once
    needs: [plan, evidence]
    # Not for a blind run: its scorer ran inside the job and nothing of its result may leave it.
    if: ${{ !cancelled() && needs.plan.outputs.run != 'blind' }}
    runs-on: ubuntu-22.04
    # Re-check K184-R03: three times the scale test's measured time, at least 30 and at most 90 minutes. L1b (run
    # 45348572248) scored about 2,250 replicates (11.9 million error-table lines) in 119 seconds with a peak of 5.1 GiB,
    # so the limit is the floor, 30 minutes. A score job that fails or stops here has produced no result: the scorer's
    # mechanics are fixed and the same artifacts scored again; the counted run is never repeated for it.
    timeout-minutes: 30
    steps:
      - name: This lane (R's installer)
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: The package under test (its scorer)
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.commit }}
          path: pkg
          persist-credentials: false
          sparse-checkout: docs/qa/workflow-execution/kit/kit-184
      - name: R (as the evidence jobs)
        run: |
          R_VERSION="$(sed -n 's/^  R_VERSION: "\(.*\)"$/\1/p' .github/workflows/distributable.yml)"
          echo "R_VERSION=$R_VERSION" >> "$GITHUB_ENV"
          R_VERSION="$R_VERSION" TOOLS_LIB="$RUNNER_TEMP/tools-lib" OUT="$RUNNER_TEMP/evidence" bash packaging/linux/build.sh r
      - uses: actions/download-artifact@v4
        with:
          pattern: k184-*
          path: ${{ runner.temp }}/jobs
      - name: Score
        run: |
          sha256sum pkg/docs/qa/workflow-execution/kit/kit-184/score-k184.R
          K184_SCORE=ruv "/opt/R/$R_VERSION/bin/Rscript" --vanilla pkg/docs/qa/workflow-execution/kit/kit-184/score-k184.R \
            "$RUNNER_TEMP/jobs" "$RUNNER_TEMP/score"
          cat "$RUNNER_TEMP/score/results-summary.md" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: score
          path: ${{ runner.temp }}/score
          retention-days: 90
