name: MOFA2 reproducibility diagnosis (KIT-062)

# Run-only lane (branch run-mofa-smoke-k062): two Linux runs of the package's MOFA2 training on the tier-1 corpus gave
# different models (191 against 186 iterations). This lane trains the same views (.github/mofa-smoke/diagnose.R) in
# many small jobs: threads (the default, or one thread: OPENBLAS_NUM_THREADS, OMP_NUM_THREADS, MKL_NUM_THREADS = 1 set
# before R and Python start) x precision (MOFA2's default float32, or float64 through the MOFA2 option that names
# float32) x repeats, each job recording its CPU model, BLAS libraries and thread counts, numpy's configuration and the
# trained values in hexadecimal. The compare job pairs them (.github/mofa-smoke/diagnose-compare.py).
# R, MOFA2's closure and the bundle's Python are installed as the smoke lane installs them; no MultiScholaR, no
# internal packages, no read token, no cache. The corpus is read from the package commit named in the parameters.
#
# Start: change .github/mofa-smoke/diagnose-params.json in a commit and push it to run-mofa-smoke-k062.

on:
  push:
    branches:
      - "run-mofa-smoke-k062"
    paths:
      - .github/mofa-smoke/diagnose-params.json
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mofa-diagnose-${{ github.ref }}
  cancel-in-progress: false

env:
  R_LIBS_USER: /nonexistent-user-library
  R_LIBS_SITE: /nonexistent-site-library

jobs:
  plan:
    name: Parameters
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.plan.outputs.commit }}
      repeats: ${{ steps.plan.outputs.repeats }}
      threads: ${{ steps.plan.outputs.threads }}
      precisions: ${{ steps.plan.outputs.precisions }}
      windows: ${{ steps.plan.outputs.windows }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/mofa-smoke
          persist-credentials: false
      - id: plan
        run: |
          p=.github/mofa-smoke/diagnose-params.json
          jq -e '(.package_commit | type == "string" and test("^[0-9a-f]{40}$")) and
            (.repeats | type == "number" and . == floor and . >= 1 and . <= 6) and
            ((.threads // ["default", "single"]) | all(IN("default", "single"))) and
            ((.precisions // ["float32", "float64"]) | all(IN("float32", "float64"))) and
            ((.windows_repeats // 0) | type == "number" and . == floor and . >= 0 and . <= 4)' "$p" > /dev/null \
            || { echo "::error::diagnose-params.json is not valid"; exit 1; }
          echo "commit=$(jq -r .package_commit "$p")" | tee -a "$GITHUB_OUTPUT"
          echo "repeats=$(jq -c '[range(1; .repeats + 1)]' "$p")" | tee -a "$GITHUB_OUTPUT"
          echo "threads=$(jq -c '.threads // ["default", "single"]' "$p")" | tee -a "$GITHUB_OUTPUT"
          echo "precisions=$(jq -c '.precisions // ["float32", "float64"]' "$p")" | tee -a "$GITHUB_OUTPUT"
          echo "windows=$(jq -c '[range(1; (.windows_repeats // 0) + 1)]' "$p")" | tee -a "$GITHUB_OUTPUT"

  diagnose:
    name: "${{ matrix.threads }} ${{ matrix.precision }} ${{ matrix.repeat }}"
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        threads: ${{ fromJSON(needs.plan.outputs.threads) }}
        precision: ${{ fromJSON(needs.plan.outputs.precisions) }}
        repeat: ${{ fromJSON(needs.plan.outputs.repeats) }}
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: The corpus at the package commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.commit }}
          path: pkg
          sparse-checkout: tests/testdata/integration
          persist-credentials: false

      - name: Versions from the distributable workflow; paths
        run: |
          for key in R_VERSION PBS_RELEASE PBS_PYTHON; do
            value="$(sed -n "s/^  $key: \"\(.*\)\"$/\1/p" .github/workflows/distributable.yml)"
            test -n "$value" || { echo "::error::$key not found in distributable.yml"; exit 1; }
            echo "$key=$value" | tee -a "$GITHUB_ENV"
          done
          {
            echo "BUNDLE=$RUNNER_TEMP/bundle"
            echo "TOOLS_LIB=$RUNNER_TEMP/tools-lib"
            echo "OUT=$RUNNER_TEMP/evidence"
            echo "RES=$RUNNER_TEMP/result"
          } >> "$GITHUB_ENV"

      - name: R, MOFA2's closure, the bundle's Python (as the smoke lane)
        run: |
          set -o pipefail
          bash packaging/linux/build.sh r
          R_LIBS="$TOOLS_LIB" "/opt/R/$R_VERSION/bin/Rscript" --vanilla .github/mofa-smoke/install-mofa-library.R plan . "$OUT"
          bash packaging/linux/build.sh sysreqs
          R_LIBS="$TOOLS_LIB" "/opt/R/$R_VERSION/bin/Rscript" --vanilla .github/mofa-smoke/install-mofa-library.R install . "$OUT" \
            > "$OUT/install-mofa-library.log" 2>&1 || { tail -n 60 "$OUT/install-mofa-library.log"; exit 1; }
          tail -n 3 "$OUT/install-mofa-library.log"
          bash packaging/linux/build.sh python
          mkdir -p "$BUNDLE/bin"
          install -m 0755 packaging/linux/Rscript "$BUNDLE/bin/Rscript"
          ln -s "/opt/R/$R_VERSION/lib/R" "$BUNDLE/R"

      - name: Train once (${{ matrix.threads }} threads, ${{ matrix.precision }})
        env:
          THREADS: ${{ matrix.threads }}
        run: |
          mkdir -p "$RES"
          if [ "$THREADS" = single ]; then
            export OPENBLAS_NUM_THREADS=1 OMP_NUM_THREADS=1 MKL_NUM_THREADS=1
          fi
          "$BUNDLE/bin/Rscript" --vanilla .github/mofa-smoke/diagnose.R "$RES" \
            "diag-${{ matrix.threads }}-${{ matrix.precision }}-${{ matrix.repeat }}" \
            "$GITHUB_WORKSPACE/pkg/tests/testdata/integration/corpus" "${{ matrix.precision }}" 2>&1 \
            | grep -vE '^Iteration [0-9]+:' | tail -n 80
          jq -e '.trained == true' "$RES/result.json" > /dev/null

      - name: Nothing token-like in the upload
        if: ${{ !cancelled() }}
        run: |
          if grep -rlE 'ghp_|github_pat_|gho_|Bearer ' "$RES"; then echo "::error::token-like text in the result"; exit 1; fi

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: diag-${{ matrix.threads }}-${{ matrix.precision }}-${{ matrix.repeat }}
          path: ${{ runner.temp }}/result
          retention-days: 14

  windows:
    name: "windows default float64 ${{ matrix.repeat }}"
    needs: plan
    if: needs.plan.outputs.windows != '[]'
    strategy:
      fail-fast: false
      matrix:
        repeat: ${{ fromJSON(needs.plan.outputs.windows) }}
    runs-on: windows-2025
    timeout-minutes: 120
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: The corpus at the package commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.commit }}
          path: pkg
          sparse-checkout: tests/testdata/integration
          persist-credentials: false

      # As the smoke lane's Windows job (.github/workflows/mofa-smoke.yml): R, MOFA2's closure, the bundle's Python.
      - name: Versions and paths
        run: |
          foreach ($key in 'R_VERSION', 'PBS_RELEASE', 'PBS_PYTHON') {
            $value = (Select-String -Path .github\workflows\distributable.yml -Pattern "^  ${key}: `"(.*)`"$").Matches[0].Groups[1].Value
            if (-not $value) { throw "$key not found in distributable.yml" }
            "$key=$value" | Tee-Object -Append -FilePath $env:GITHUB_ENV
          }
          "BUNDLE=$env:RUNNER_TEMP\bundle" >> $env:GITHUB_ENV
          "TOOLS_LIB=$env:RUNNER_TEMP\tools-lib" >> $env:GITHUB_ENV
          "OUT=$env:RUNNER_TEMP\evidence" >> $env:GITHUB_ENV
          "RES=$env:RUNNER_TEMP\result" >> $env:GITHUB_ENV
          "R_LIBS_USER=$env:RUNNER_TEMP\nonexistent-user-library" >> $env:GITHUB_ENV
          "R_LIBS_SITE=$env:RUNNER_TEMP\nonexistent-site-library" >> $env:GITHUB_ENV

      - name: R into the folder; jsonlite in a build-tool library
        run: |
          pwsh -NoProfile -File packaging\windows\assemble.ps1 -Action r -Bundle $env:BUNDLE -RVersion $env:R_VERSION
          if ($LASTEXITCODE -ne 0) { throw "assemble.ps1 -Action r failed" }
          New-Item -ItemType Directory -Force $env:TOOLS_LIB, $env:OUT, $env:RES | Out-Null
          & "$env:BUNDLE\R\bin\Rscript.exe" --vanilla -e "install.packages('jsonlite', lib = commandArgs(TRUE)[[1]], repos = 'https://packagemanager.posit.co/cran/latest', type = 'binary')" $env:TOOLS_LIB
          if ($LASTEXITCODE -ne 0) { throw "could not install jsonlite into the build-tool library" }

      - name: Install MOFA2 and its dependencies (versions against the bundle's)
        run: |
          $env:PATH = "C:\rtools45\x86_64-w64-mingw32.static.posix\bin;C:\rtools45\usr\bin;$env:PATH"
          $env:R_LIBS = $env:TOOLS_LIB
          $rscript = "$env:BUNDLE\R\bin\Rscript.exe"
          & $rscript --vanilla .github\mofa-smoke\install-mofa-library.R plan . $env:OUT
          if ($LASTEXITCODE -ne 0) { throw "plan failed" }
          & $rscript --vanilla .github\mofa-smoke\install-mofa-library.R install . $env:OUT *> "$env:OUT\install-mofa-library.log"
          $status = $LASTEXITCODE
          Get-Content "$env:OUT\install-mofa-library.log" | Select-Object -Last 5
          if ($status -ne 0) { throw "install failed" }

      - name: The bundle's Python (hashes checked)
        run: |
          curl.exe -fsSL -o "$env:RUNNER_TEMP\python.tar.gz" "https://github.com/astral-sh/python-build-standalone/releases/download/${env:PBS_RELEASE}/cpython-${env:PBS_PYTHON}%2B${env:PBS_RELEASE}-x86_64-pc-windows-msvc-install_only.tar.gz"
          & "$env:SystemRoot\System32\tar.exe" -xzf "$env:RUNNER_TEMP\python.tar.gz" -C $env:BUNDLE
          if ($LASTEXITCODE -ne 0) { throw "could not unpack Python" }
          $env:PYTHONNOUSERSITE = '1'
          & "$env:BUNDLE\python\python.exe" -m pip install --no-cache-dir --no-warn-script-location --require-hashes --only-binary=:all: --no-deps -r packaging\python\requirements.txt
          if ($LASTEXITCODE -ne 0) { throw "pip install failed" }

      - name: Train once (default threads, float64; packaging/verify/windows-clean-run.ps1)
        run: |
          $script = Join-Path $env:GITHUB_WORKSPACE '.github\mofa-smoke\diagnose.R'
          $corpus = Join-Path $env:GITHUB_WORKSPACE 'pkg\tests\testdata\integration\corpus'
          $arguments = @($env:RES, 'diag-windows-default-float64-${{ matrix.repeat }}', $corpus, 'float64')
          & packaging\verify\windows-clean-run.ps1 -Bundle $env:BUNDLE -Script $script -Arguments $arguments
          if ($LASTEXITCODE -ne 0) { throw "the diagnosis did not train" }

      - name: Nothing token-like in the upload
        if: ${{ !cancelled() }}
        run: |
          $hits = Get-ChildItem -Recurse -File $env:RES | Select-String -Pattern 'ghp_|github_pat_|gho_|Bearer ' -List
          if ($hits) { $hits.Path; throw "token-like text in the result" }

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: diag-windows-default-float64-${{ matrix.repeat }}
          path: ${{ runner.temp }}\result
          retention-days: 14

  compare:
    name: Compare the jobs
    needs: [plan, diagnose, windows]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/mofa-smoke
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.commit }}
          path: pkg
          sparse-checkout: tests/testdata/integration/mofa_reference
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: diag-*
          path: ${{ runner.temp }}/jobs
      - name: Pairwise
        run: |
          python3 -I .github/mofa-smoke/diagnose-compare.py "$RUNNER_TEMP/jobs" \
            "$GITHUB_WORKSPACE/pkg/tests/testdata/integration/mofa_reference" "$RUNNER_TEMP/compare"
          cat "$RUNNER_TEMP/compare/diagnose.md" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: compare
          path: ${{ runner.temp }}/compare
          retention-days: 14
