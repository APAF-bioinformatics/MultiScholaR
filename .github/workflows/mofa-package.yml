name: MOFA2 package test (KIT-062)

# Run-only lane (branch run-mofa-smoke-k062; KIT-062): MultiScholaR's MOFA2 test files against the package commit
# under test, installed with the KIT-134 snapshot library (./.github/actions/snapshot-library of that commit: R 4.6.1,
# the bundle's R packages, the two internal packages built in the job with DEPS_READ_TOKEN, MultiScholaR from the
# checkout), MOFA2's closure from the same snapshot (.github/mofa-smoke/install-mofa-library.R, versions checked
# against the bundle's) and the bundle's Python (packaging/linux/build.sh python, hashes checked). R is started through
# the bundle's launcher (packaging/linux/Rscript), which sets RETICULATE_PYTHON to the bundle's Python.
#
# Start: change .github/mofa-smoke/package-params.json in a commit and push it to run-mofa-smoke-k155 (KIT-155 copy of the KIT-143 lane, itself the KIT-143 copy of the KIT-151 lane, itself the KIT-151 copy of the KIT-152 lane, itself the KIT-152 copy of the KIT-148 lane, itself the KIT-148 copy of the KIT-147 lane, itself the KIT-142 lane:
# pandoc installed for the integration report; MULTISCHOLAR_INTEGRATION_EVIDENCE_OUT set to the upload's kit142 folder).
#   package_commit  40-digit commit of MultiScholaR to install and test
#   tests           test-*.R files of that commit's tests/testthat
#   record          true: MULTISCHOLAR_MOFA_REFERENCE_OUT is set, the trained tables are written to the upload
# Token rules (as run-tests): the token goes only to the library action; no cache of any kind; nothing built with it
# and no install or build output is uploaded (only the test results under RUNNER_TEMP/result, scanned first).
# Linux only: the snapshot library has no Windows action outside the distributable build.

on:
  push:
    branches:
      - "run-mofa-smoke-k240"
    paths:
      - .github/mofa-smoke/package-params.json
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mofa-package-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    name: Parameters
    runs-on: ubuntu-latest
    outputs:
      label: ${{ steps.plan.outputs.label }}
      commit: ${{ steps.plan.outputs.commit }}
      tests: ${{ steps.plan.outputs.tests }}
      record: ${{ steps.plan.outputs.record }}
      runs: ${{ steps.plan.outputs.runs }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/mofa-smoke
          persist-credentials: false
      - id: plan
        run: |
          p=.github/mofa-smoke/package-params.json
          jq -e '(.label | type == "string" and test("^[A-Za-z0-9][A-Za-z0-9-]{0,30}$")) and
            (.package_commit | type == "string" and test("^[0-9a-f]{40}$")) and
            (.tests | type == "array" and length >= 1 and all(type == "string" and test("^test-[A-Za-z0-9_.-]+[.]R$"))) and
            (.record | type == "boolean") and ((.runs // 1) | type == "number" and . == floor and . >= 1 and . <= 4)' "$p" > /dev/null || { echo "::error::package-params.json is not valid"; exit 1; }
          {
            echo "label=$(jq -r .label "$p")"
            echo "commit=$(jq -r .package_commit "$p")"
            echo "tests=$(jq -r '.tests | join(" ")' "$p")"
            echo "record=$(jq -r .record "$p")"
            echo "runs=$(jq -c '[range(1; (.runs // 1) + 1)]' "$p")"
          } | tee -a "$GITHUB_OUTPUT"

  linux:
    name: Linux ${{ matrix.run }} (package ${{ needs.plan.outputs.commit }})
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        run: ${{ fromJSON(needs.plan.outputs.runs) }}
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - name: The package under test (package_commit)
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.commit }}
          persist-credentials: false
          lfs: false

      - name: This lane's scripts (the MOFA2 installer, the launcher, the Python build)
        uses: actions/checkout@v4
        with:
          path: lane
          persist-credentials: false

      - name: Versions from the distributable workflow (R, python-build-standalone, CPython); paths
        run: |
          for key in R_VERSION PBS_RELEASE PBS_PYTHON; do
            value="$(sed -n "s/^  $key: \"\(.*\)\"$/\1/p" lane/.github/workflows/distributable.yml)"
            test -n "$value" || { echo "::error::$key not found in distributable.yml"; exit 1; }
            echo "$key=$value" | tee -a "$GITHUB_ENV"
          done
          {
            echo "BUNDLE=$RUNNER_TEMP/bundle"
            echo "OUT=$RUNNER_TEMP/evidence"
            echo "RES=$RUNNER_TEMP/result"
          } >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/evidence" "$RUNNER_TEMP/result"
          lscpu > "$RUNNER_TEMP/result/lscpu.txt"; nproc >> "$RUNNER_TEMP/result/lscpu.txt"

      - name: R 4.6.1, the KIT-134 library, the internal packages and MultiScholaR at package_commit (no cache)
        uses: ./.github/actions/snapshot-library
        with:
          token: ${{ secrets.DEPS_READ_TOKEN }}
          extra-packages: "any::testthat"

      - name: MOFA2's closure from the snapshot (plan, system libraries, install; versions against the bundle's)
        run: |
          set -o pipefail
          R_LIBS="$MSR_TOOLS_LIB" /opt/R/4.6.1/bin/Rscript --vanilla lane/.github/mofa-smoke/install-mofa-library.R plan lane "$OUT"
          (cd lane && bash packaging/linux/build.sh sysreqs)
          R_LIBS="$MSR_TOOLS_LIB" /opt/R/4.6.1/bin/Rscript --vanilla lane/.github/mofa-smoke/install-mofa-library.R install lane "$OUT" \
            2>&1 | tee "$OUT/install-mofa-library.log" | { grep -vE '^(\* |trying URL|Content type|downloaded|=+$)' || true; } | tail -n 40
          cp "$OUT/mofa-library-versions.tsv" "$RES/"

      - name: The bundle's Python (packaging/linux/build.sh python; hashes checked)
        run: |
          (cd lane && bash packaging/linux/build.sh python)
          cp "$OUT/python-packages.txt" "$RES/"

      - name: Bundle-shaped folder for the launcher (bin/Rscript = packaging/linux/Rscript, R -> the R home)
        run: |
          mkdir -p "$BUNDLE/bin"
          install -m 0755 lane/packaging/linux/Rscript "$BUNDLE/bin/Rscript"
          ln -s "/opt/R/$R_VERSION/lib/R" "$BUNDLE/R"

      - name: pandoc for the integration report (KIT-142; the distribution's package)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq pandoc
          # Where the bundle carries pandoc (the launcher sets RSTUDIO_PANDOC to it).
          mkdir -p "$BUNDLE/pandoc"
          ln -s /usr/bin/pandoc "$BUNDLE/pandoc/pandoc"
          pandoc --version | head -n 1 | tee "$RES/pandoc-version.txt"

      - name: The test files (installed MultiScholaR, the bundle's launcher)
        env:
          RECORD: ${{ needs.plan.outputs.record }}
          TESTS: ${{ needs.plan.outputs.tests }}
        run: |
          set -o pipefail
          if [ "$RECORD" = true ]; then export MULTISCHOLAR_MOFA_REFERENCE_OUT="$RES/mofa_reference"; fi
          export MULTISCHOLAR_INTEGRATION_EVIDENCE_OUT="$RES/kit142"
          started=$(date +%s)
          set +e
          # shellcheck disable=SC2086
          "$BUNDLE/bin/Rscript" --vanilla lane/.github/mofa-smoke/package-test.R "$GITHUB_WORKSPACE" "$RES" $TESTS \
            2>&1 | tee "$RES/test-console.log"
          status=$?
          set -e
          echo "exit $status after $(( $(date +%s) - started )) s" | tee "$RES/exit.txt"
          test "$status" = 0

      - name: Folders basilisk, reticulate or uv would have created
        if: ${{ !cancelled() }}
        run: |
          for d in "$HOME/.cache/R/basilisk" "$HOME/.cache/R/reticulate" "$HOME/.cache/uv" "$HOME/.local/share/r-miniconda" "$HOME/.virtualenvs"; do
            if [ -e "$d" ]; then echo "present: $d"; else echo "absent: $d"; fi
          done | tee "$RES/caches.txt"

      - name: Nothing token-like in the upload; files naming the internal packages withheld
        if: ${{ !cancelled() }}
        run: |
          if grep -rlE 'ghp_|github_pat_|gho_|Bearer ' "$RES"; then
            echo "::error::token-like text in the result"; exit 1
          fi
          grep -rlE 'fast_duckdb|fast_limpa_dpc|fastduckdb|fastlimpadpc' "$RES" | while read -r f; do
            rm -f "$f"; echo "withheld: ${f#"$RES"/}" | tee -a "$RES/withheld.txt"
          done
          du -sh "$RES"; find "$RES" -type f | sort

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: mofa-package-linux-${{ matrix.run }}
          path: ${{ runner.temp }}/result
          retention-days: 14
