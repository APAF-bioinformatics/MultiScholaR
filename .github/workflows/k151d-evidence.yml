name: MOFA2 evidence k151d (RUV input, z-score and scale_views, pin on Intel)

# Run-only lane (branch run-mofa-evidence-k151d; methods ledger INT-13). Declarations:
# docs/qa/workflow-execution/kit/kit-151d/{ruv,z,pin}-declaration.md. Tasks: ruv (Q1), z (Q2), pin (Q3); "lifecycle"
# runs a tiny version of all three, each with a deliberately failing cell. The job list of each task is fixed here
# (declared), not taken from the parameters; the parameters choose the task, the run kind, the RUV strength candidate
# (ruv) and the batch (pin).
# R, MOFA2's closure and the bundle's Python are installed as the smoke lane installs them; task ruv also installs
# RUVIIIC and ruv (bundle versions) and sva (the lockfile's version at e8a2ac67). No MultiScholaR, no internal
# packages, no token.
#
# Start: change .github/mofa-smoke/k151d-params.json in a commit and push it to run-mofa-evidence-k151d.

on:
  push:
    branches:
      - "run-mofa-evidence-k151d"
    paths:
      - .github/mofa-smoke/k151d-params.json

permissions:
  contents: read

env:
  R_LIBS_USER: /nonexistent-user-library
  R_LIBS_SITE: /nonexistent-site-library

jobs:
  plan:
    name: Parameters
    runs-on: ubuntu-latest
    outputs:
      jobs: ${{ steps.plan.outputs.jobs }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/mofa-smoke
          persist-credentials: false
      - id: plan
        run: |
          p=.github/mofa-smoke/k151d-params.json
          jq -e '(.run | IN("lifecycle", "counted")) and (.task | IN("lifecycle", "ruv", "z", "pin")) and
            ((.run == "lifecycle") == (.task == "lifecycle")) and
            (.task != "ruv" or (.strength | IN("C1", "C2"))) and
            (.task != "pin" or (.batch | IN(1, 2, 3)))' "$p" > /dev/null \
            || { echo "::error::k151d-params.json is not valid"; exit 1; }
          task="$(jq -r .task "$p")"
          ruv_arms="raw,ideal,ruv_k1,ruv_k2,ruv_k3,calibrated"
          # Q2 cells (declared): code m<missing>_<scales>_z<which>_sv<scale_views>
          z20="m1_orig_znone_sv1,m1_orig_zall_sv1,m1_orig_zsmall_sv1,m1_orig_zlarge_sv1,m1_orig_znone_sv0,m1_orig_zall_sv0"
          z20="$z20,m0_orig_znone_sv1,m0_orig_zall_sv1,m0_orig_zsmall_sv1,m0_orig_zlarge_sv1,m0_orig_znone_sv0,m0_orig_zall_sv0"
          z20="$z20,m1_none_znone_sv1,m1_none_znone_sv0,m1_lup_znone_sv1,m1_lup_znone_sv0,m1_ldown_znone_sv1,m1_ldown_znone_sv0"
          z20="$z20,m0_none_znone_sv1,m0_none_znone_sv0,m0_lup_znone_sv1,m0_lup_znone_sv0,m0_ldown_znone_sv1,m0_ldown_znone_sv0"
          z60="m1_orig_znone_sv1,m1_orig_zall_sv1,m1_orig_zsmall_sv1,m0_orig_znone_sv1,m0_orig_zall_sv1,m0_orig_zsmall_sv1"
          z60="$z60,m1_orig_znone_sv0,m1_none_znone_sv1,m1_none_znone_sv0,m1_lup_znone_sv1,m1_lup_znone_sv0,m1_ldown_znone_sv1,m1_ldown_znone_sv0"
          pin_cases="fast:none,fast:scale_views,fast:cap1000,fast:cap2000,fast:cap5000,fast:cap10000,fast:weight_views,fast:zscore,hard_prev10_none,hard_full23_default"
          pin_pn="fast:none,fast:scale_views,fast:cap1000,fast:cap2000,fast:cap5000,fast:cap10000,fast:weight_views,fast:zscore"
          case "$task" in
            lifecycle)
              jobs="$(jq -cn --arg arms "raw,ruv_k1,ruv_k2,ruv_k3,calibrated,probe_fail" --arg z20 "$z20,probe_fail" --arg z60 "$z60" '
                [("C1", "C2") as $s | (20, 60) as $n |
                  {id: "life-ruv--\($s)-n\($n)", task: "ruv", number: 0, cases: "", pn: "",
                   calls: "ruv \($n) main \($s) 91,92,93,94,95,96,97,98,99,100 ideal;ruv \($n) main,conf \($s) 91 \($arms)"}] +
                [{id: "life-z--n20", task: "z", number: 0, cases: "", pn: "", calls: "z 20 91 \($z20);z 20 92 \($z20)"},
                 {id: "life-z--n60", task: "z", number: 0, cases: "", pn: "", calls: "z 60 91 \($z60)"}] +
                [{id: "life-pin--01", task: "pin", number: 1, calls: "", cases: "fast:cap1000,hard_full23_default,probe_fail", pn: "fast:cap1000"},
                 {id: "life-pin--99", task: "pin", number: 99, calls: "", cases: "fast:cap1000,hard_full23_default", pn: "fast:cap1000"}]')" ;;
            ruv)
              strength="$(jq -r .strength "$p")"
              jobs="$(jq -cn --arg arms "$ruv_arms" --arg s "$strength" '[(20, 60) as $n | ("main", "conf") as $sc | (0, 1, 2) as $b |
                {id: "ruv--n\($n)-\($sc)-\($b + 1)", task: "ruv", number: 0, cases: "", pn: "",
                 calls: "ruv \($n) \($sc) \($s) \([range($b * 10 + 1; $b * 10 + 11) | tostring] | join(",")) \($arms)"}]')" ;;
            z)
              jobs="$(jq -cn --arg z20 "$z20" --arg z60 "$z60" '[(20, 60) as $n | range(0; 15) as $b |
                {id: "z--n\($n)-\($b * 2 + 1)", task: "z", number: 0, cases: "", pn: "",
                 calls: "z \($n) \($b * 2 + 1) \(if $n == 20 then $z20 else $z60 end);z \($n) \($b * 2 + 2) \(if $n == 20 then $z20 else $z60 end)"}]')" ;;
            pin)
              batch="$(jq -r .batch "$p")"
              jobs="$(jq -cn --arg cases "$pin_cases" --arg pn "$pin_pn" --argjson b "$batch" '[range(($b - 1) * 20 + 1; $b * 20 + 1) |
                {id: ("pin--" + (if . < 10 then "0" else "" end) + tostring), task: "pin", number: ., calls: "", cases: $cases, pn: $pn}]')" ;;
          esac
          echo "jobs=$(echo "$jobs" | jq -c .)" | tee -a "$GITHUB_OUTPUT"

  evidence:
    name: "${{ matrix.id }}"
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.jobs) }}
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    steps:
      # Q3: jobs 1 to 4 always run; a later pin job runs only on an Intel processor (declared), so jobs that land on
      # AMD cost about a minute. Every other task always runs.
      - name: Processor
        id: cpu
        env:
          TASK: ${{ matrix.task }}
          NUMBER: ${{ matrix.number }}
        run: |
          mkdir -p "$RUNNER_TEMP/result"
          lscpu | tee "$RUNNER_TEMP/result/lscpu.txt"
          vendor="$(sed -n 's/^Vendor ID: *//p' "$RUNNER_TEMP/result/lscpu.txt" | head -n 1)"
          model="$(sed -n 's/^Model name: *//p' "$RUNNER_TEMP/result/lscpu.txt" | head -n 1)"
          full=true
          if [ "$TASK" = pin ] && [ "$NUMBER" -gt 4 ] && [ "$vendor" != GenuineIntel ]; then full=false; fi
          printf 'vendor\t%s\nmodel\t%s\nfull\t%s\n' "$vendor" "$model" "$full" | tee "$RUNNER_TEMP/result/cpu.tsv"
          echo "full=$full" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: ${{ steps.cpu.outputs.full == 'true' }}
        with:
          persist-credentials: false

      - name: Versions from the distributable workflow; paths
        if: ${{ steps.cpu.outputs.full == 'true' }}
        run: |
          for key in R_VERSION PBS_RELEASE PBS_PYTHON; do
            value="$(sed -n "s/^  $key: \"\(.*\)\"$/\1/p" .github/workflows/distributable.yml)"
            test -n "$value" || { echo "::error::$key not found in distributable.yml"; exit 1; }
            echo "$key=$value" | tee -a "$GITHUB_ENV"
          done
          {
            echo "BUNDLE=$RUNNER_TEMP/bundle"
            echo "TOOLS_LIB=$RUNNER_TEMP/tools-lib"
            echo "OUT=$RUNNER_TEMP/evidence"
            echo "RES=$RUNNER_TEMP/result"
          } >> "$GITHUB_ENV"

      - name: R, MOFA2's closure, the bundle's Python (as the smoke lane)
        if: ${{ steps.cpu.outputs.full == 'true' }}
        run: |
          set -o pipefail
          bash packaging/linux/build.sh r
          R_LIBS="$TOOLS_LIB" "/opt/R/$R_VERSION/bin/Rscript" --vanilla .github/mofa-smoke/install-mofa-library.R plan . "$OUT"
          bash packaging/linux/build.sh sysreqs
          R_LIBS="$TOOLS_LIB" "/opt/R/$R_VERSION/bin/Rscript" --vanilla .github/mofa-smoke/install-mofa-library.R install . "$OUT" \
            > "$OUT/install-mofa-library.log" 2>&1 || { tail -n 60 "$OUT/install-mofa-library.log"; exit 1; }
          tail -n 3 "$OUT/install-mofa-library.log"
          bash packaging/linux/build.sh python
          mkdir -p "$BUNDLE/bin"
          install -m 0755 packaging/linux/Rscript "$BUNDLE/bin/Rscript"
          ln -s "/opt/R/$R_VERSION/lib/R" "$BUNDLE/R"

      - name: RUV-III functions (bundle versions) and sva (lockfile version at e8a2ac67) (task ruv)
        if: ${{ steps.cpu.outputs.full == 'true' && matrix.task == 'ruv' }}
        run: |
          R_LIBS="$TOOLS_LIB" "/opt/R/$R_VERSION/bin/Rscript" --vanilla .github/mofa-smoke/install-ruv-library.R . "$OUT" \
            > "$OUT/install-ruv-library.log" 2>&1 || { tail -n 60 "$OUT/install-ruv-library.log"; exit 1; }
          tail -n 25 "$OUT/install-ruv-library.log"
          R_LIBS="$TOOLS_LIB" "/opt/R/$R_VERSION/bin/Rscript" --vanilla .github/mofa-smoke/install-sva-library.R . "$OUT" \
            > "$OUT/install-sva-library.log" 2>&1 || { tail -n 80 "$OUT/install-sva-library.log"; exit 1; }
          tail -n 60 "$OUT/install-sva-library.log"

      - name: Run (${{ matrix.id }})
        if: ${{ steps.cpu.outputs.full == 'true' }}
        env:
          TASK: ${{ matrix.task }}
          CALLS: ${{ matrix.calls }}
          CASES: ${{ matrix.cases }}
          PN_CASES: ${{ matrix.pn }}
        run: |
          set -o pipefail
          mkdir -p "$RES"
          cp "$OUT/mofa-library-versions.tsv" "$RES/" || true
          cp "$OUT/ruv-library-versions.tsv" "$OUT/sva-library-versions.tsv" "$RES/" 2>/dev/null || true
          sha256sum .github/mofa-smoke/k151d.R .github/mofa-smoke/k151d-score.R .github/mofa-smoke/install-sva-library.R \
            .github/mofa-smoke/install-ruv-library.R .github/workflows/k151d-evidence.yml | tee "$RES/script-sha256.txt"
          run_r() { "$BUNDLE/bin/Rscript" --vanilla .github/mofa-smoke/k151d.R "$@" 2>&1 | grep -vE '^Iteration [0-9]+:'; }
          status=0
          if [ "$TASK" = pin ]; then
            # numpy's dispatched AVX-512 targets that this CPU has (PN turns them off; empty where the CPU has none)
            npy_off="$(env -i PATH=/usr/bin:/bin "$BUNDLE/python/bin/python3" -I -c 'from numpy.core._multiarray_umath import __cpu_features__ as f, __cpu_dispatch__ as d; print(" ".join(x for x in d if x.startswith("AVX512") and f.get(x)))')"
            echo "numpy AVX-512 dispatch targets on this CPU: [$npy_off]" | tee "$RES/numpy-avx512.txt"
            ( run_r "$RES/U" pin U "$CASES" ) || status=1
            ( export OPENBLAS_NUM_THREADS=1 OMP_NUM_THREADS=1 MKL_NUM_THREADS=1 OPENBLAS_CORETYPE=Haswell
              run_r "$RES/P" pin P "$CASES" ) || status=1
            ( export OPENBLAS_NUM_THREADS=1 OMP_NUM_THREADS=1 MKL_NUM_THREADS=1 OPENBLAS_CORETYPE=Haswell
              export NPY_DISABLE_CPU_FEATURES="$npy_off"
              run_r "$RES/PN" pin PN "$PN_CASES" ) || status=1
          else
            i=0
            IFS=';' read -ra calls <<< "$CALLS"
            for call in "${calls[@]}"; do
              i=$((i + 1))
              read -ra args <<< "$call"
              ( run_r "$RES/call-$i" "${args[@]}" ) || status=1
            done
          fi
          exit "$status"

      - name: Nothing token-like in the upload
        if: ${{ !cancelled() }}
        run: |
          if grep -rlE 'ghp_|github_pat_|gho_|Bearer ' "$RUNNER_TEMP/result"; then echo "::error::token-like text in the result"; exit 1; fi

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: k151d-${{ matrix.id }}
          path: ${{ runner.temp }}/result
          retention-days: 30

  score:
    name: Assemble and score
    needs: [plan, evidence]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: R (as the evidence jobs)
        run: |
          R_VERSION="$(sed -n 's/^  R_VERSION: "\(.*\)"$/\1/p' .github/workflows/distributable.yml)"
          echo "R_VERSION=$R_VERSION" >> "$GITHUB_ENV"
          R_VERSION="$R_VERSION" TOOLS_LIB="$RUNNER_TEMP/tools-lib" OUT="$RUNNER_TEMP/evidence" bash packaging/linux/build.sh r
      - uses: actions/download-artifact@v4
        with:
          pattern: k151d-*
          path: ${{ runner.temp }}/jobs
      - name: Score once per task present
        run: |
          sha256sum .github/mofa-smoke/k151d-score.R
          status=0
          for t in ruv z pin; do
            mkdir -p "$RUNNER_TEMP/by/$t"
            for d in "$RUNNER_TEMP"/jobs/k151d-"$t"--* "$RUNNER_TEMP"/jobs/k151d-life-"$t"--*; do
              [ -d "$d" ] && mv "$d" "$RUNNER_TEMP/by/$t/"
            done
            if [ -n "$(ls -A "$RUNNER_TEMP/by/$t")" ]; then
              "/opt/R/$R_VERSION/bin/Rscript" --vanilla .github/mofa-smoke/k151d-score.R "$t" "$RUNNER_TEMP/by/$t" \
                docs/qa/workflow-execution/kit/kit-151d/ref "$RUNNER_TEMP/score" || status=1
              cat "$RUNNER_TEMP/score/$t-score.md" >> "$GITHUB_STEP_SUMMARY" || true
            fi
          done
          exit "$status"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: score
          path: ${{ runner.temp }}/score
          retention-days: 30
