name: MOFA2 selection evidence, run b (KIT-151)

# Run-only lane (branch run-mofa-evidence-k151b): feature selection before MOFA2 on more realistic simulated data
# (mean-variance trend, abundance-dependent missing values, data sets on different scales). Declaration:
# docs/qa/workflow-execution/kit/kit-151/selection-b-declaration.md. One job per data seed
# (.github/mofa-smoke/k151b.R trains every cell of the three scenarios in turn); the score job assembles the tables and
# computes the declared paired comparisons (.github/mofa-smoke/k151b-score.py).
# R, MOFA2's closure and the bundle's Python are installed as the smoke lane installs them; no MultiScholaR, no
# internal packages, no token.
#
# Start: change .github/mofa-smoke/k151b-params.json in a commit and push it to run-mofa-evidence-k151b.

on:
  push:
    branches:
      - "run-mofa-evidence-k151b"
    paths:
      - .github/mofa-smoke/k151b-params.json

permissions:
  contents: read

concurrency:
  group: k151b-${{ github.ref }}
  cancel-in-progress: false

env:
  R_LIBS_USER: /nonexistent-user-library
  R_LIBS_SITE: /nonexistent-site-library

jobs:
  plan:
    name: Parameters
    runs-on: ubuntu-latest
    outputs:
      seeds: ${{ steps.plan.outputs.seeds }}
      cells: ${{ steps.plan.outputs.cells }}
      maxiter: ${{ steps.plan.outputs.maxiter }}
      probe: ${{ steps.plan.outputs.probe }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/mofa-smoke
          persist-credentials: false
      - id: plan
        run: |
          p=.github/mofa-smoke/k151b-params.json
          jq -e '(.run | IN("lifecycle", "counted")) and
            (.seeds | type == "array" and length >= 1 and all(type == "number" and . == floor and ((. >= 1 and . <= 30) or . == 91 or . == 92))) and
            (.cells | type == "string" and test("^[a-z0-9_,:]+$")) and
            (.maxiter | type == "number" and . == floor and . >= 1000 and . <= 50000) and
            (.probe | IN(0, 1))' "$p" > /dev/null \
            || { echo "::error::k151b-params.json is not valid"; exit 1; }
          echo "seeds=$(jq -c .seeds "$p")" | tee -a "$GITHUB_OUTPUT"
          echo "cells=$(jq -r .cells "$p")" | tee -a "$GITHUB_OUTPUT"
          echo "maxiter=$(jq -r .maxiter "$p")" | tee -a "$GITHUB_OUTPUT"
          echo "probe=$(jq -r .probe "$p")" | tee -a "$GITHUB_OUTPUT"

  evidence:
    name: "seed ${{ matrix.seed }}"
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        seed: ${{ fromJSON(needs.plan.outputs.seeds) }}
    runs-on: ubuntu-22.04
    timeout-minutes: 300

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Versions from the distributable workflow; paths
        run: |
          for key in R_VERSION PBS_RELEASE PBS_PYTHON; do
            value="$(sed -n "s/^  $key: \"\(.*\)\"$/\1/p" .github/workflows/distributable.yml)"
            test -n "$value" || { echo "::error::$key not found in distributable.yml"; exit 1; }
            echo "$key=$value" | tee -a "$GITHUB_ENV"
          done
          {
            echo "BUNDLE=$RUNNER_TEMP/bundle"
            echo "TOOLS_LIB=$RUNNER_TEMP/tools-lib"
            echo "OUT=$RUNNER_TEMP/evidence"
            echo "RES=$RUNNER_TEMP/result"
          } >> "$GITHUB_ENV"

      - name: R, MOFA2's closure, the bundle's Python (as the smoke lane)
        run: |
          set -o pipefail
          bash packaging/linux/build.sh r
          R_LIBS="$TOOLS_LIB" "/opt/R/$R_VERSION/bin/Rscript" --vanilla .github/mofa-smoke/install-mofa-library.R plan . "$OUT"
          bash packaging/linux/build.sh sysreqs
          R_LIBS="$TOOLS_LIB" "/opt/R/$R_VERSION/bin/Rscript" --vanilla .github/mofa-smoke/install-mofa-library.R install . "$OUT" \
            > "$OUT/install-mofa-library.log" 2>&1 || { tail -n 60 "$OUT/install-mofa-library.log"; exit 1; }
          tail -n 3 "$OUT/install-mofa-library.log"
          bash packaging/linux/build.sh python
          mkdir -p "$BUNDLE/bin"
          install -m 0755 packaging/linux/Rscript "$BUNDLE/bin/Rscript"
          ln -s "/opt/R/$R_VERSION/lib/R" "$BUNDLE/R"

      - name: Train every cell (seed ${{ matrix.seed }})
        env:
          CELLS: ${{ needs.plan.outputs.cells }}
          MAXITER: ${{ needs.plan.outputs.maxiter }}
          PROBE: ${{ needs.plan.outputs.probe }}
        run: |
          set -o pipefail
          mkdir -p "$RES"
          cp "$OUT/mofa-library-versions.tsv" "$RES/" || true
          sha256sum .github/mofa-smoke/k151b.R .github/mofa-smoke/k151b-score.py | tee "$RES/script-sha256.txt"
          "$BUNDLE/bin/Rscript" --vanilla .github/mofa-smoke/k151b.R "$RES" "${{ matrix.seed }}" "$CELLS" \
            "$MAXITER" "$PROBE" 2>&1 | grep -vE '^Iteration [0-9]+:' | tail -n 200

      - name: Nothing token-like in the upload
        if: ${{ !cancelled() }}
        run: |
          if grep -rlE 'ghp_|github_pat_|gho_|Bearer ' "$RES"; then echo "::error::token-like text in the result"; exit 1; fi

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: k151b-seed-${{ matrix.seed }}
          path: ${{ runner.temp }}/result
          retention-days: 30

  score:
    name: Assemble and score
    needs: [plan, evidence]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github/mofa-smoke
            docs/qa/workflow-execution/kit/kit-151
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: k151b-seed-*
          path: ${{ runner.temp }}/jobs
      - name: Score once
        run: |
          sha256sum .github/mofa-smoke/k151b-score.py
          python3 -I .github/mofa-smoke/k151b-score.py "$RUNNER_TEMP/jobs" .github/mofa-smoke/k151b-params.json \
            docs/qa/workflow-execution/kit/kit-151/followup-rows.tsv "$RUNNER_TEMP/score"
          cat "$RUNNER_TEMP/score/selection-b-score.md" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: selection-b-score
          path: ${{ runner.temp }}/score
          retention-days: 30
