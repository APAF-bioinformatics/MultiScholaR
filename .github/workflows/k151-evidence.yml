name: MOFA2 cap evidence (KIT-151)

# Run-only lane (branch run-mofa-evidence-k151): which balancing of data sets lets MOFA2 find a factor that lives only
# in the small data sets without losing one that lives only in the large data set. Declaration:
# docs/qa/workflow-execution/kit/kit-151/cap-evidence-declaration.md. One job per scenario x data seed
# (.github/mofa-smoke/k151-evidence.R trains every arm in turn); the score job assembles one table and applies the
# pre-declared rule (.github/mofa-smoke/k151-score.py).
# R, MOFA2's closure and the bundle's Python are installed as the smoke lane installs them; no MultiScholaR, no
# internal packages, no token.
#
# Start: change .github/mofa-smoke/k151-params.json in a commit and push it to run-mofa-evidence-k151.

on:
  push:
    branches:
      - "run-mofa-evidence-k151"
    paths:
      - .github/mofa-smoke/k151-params.json

permissions:
  contents: read

concurrency:
  group: k151-evidence-${{ github.ref }}
  cancel-in-progress: false

env:
  R_LIBS_USER: /nonexistent-user-library
  R_LIBS_SITE: /nonexistent-site-library

jobs:
  plan:
    name: Parameters
    runs-on: ubuntu-latest
    outputs:
      scenarios: ${{ steps.plan.outputs.scenarios }}
      seeds: ${{ steps.plan.outputs.seeds }}
      arms: ${{ steps.plan.outputs.arms }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/mofa-smoke
          persist-credentials: false
      - id: plan
        run: |
          p=.github/mofa-smoke/k151-params.json
          jq -e '(.scenarios | type == "array" and length >= 1 and all(IN("main", "n60", "missing"))) and
            (.seeds | type == "number" and . == floor and . >= 1 and . <= 10) and
            (.arms | type == "string" and test("^[a-z0-9_,]+$"))' "$p" > /dev/null \
            || { echo "::error::k151-params.json is not valid"; exit 1; }
          echo "scenarios=$(jq -c .scenarios "$p")" | tee -a "$GITHUB_OUTPUT"
          echo "seeds=$(jq -c '[range(1; .seeds + 1)]' "$p")" | tee -a "$GITHUB_OUTPUT"
          echo "arms=$(jq -r .arms "$p")" | tee -a "$GITHUB_OUTPUT"

  evidence:
    name: "${{ matrix.scenario }} seed ${{ matrix.seed }}"
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        scenario: ${{ fromJSON(needs.plan.outputs.scenarios) }}
        seed: ${{ fromJSON(needs.plan.outputs.seeds) }}
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Versions from the distributable workflow; paths
        run: |
          for key in R_VERSION PBS_RELEASE PBS_PYTHON; do
            value="$(sed -n "s/^  $key: \"\(.*\)\"$/\1/p" .github/workflows/distributable.yml)"
            test -n "$value" || { echo "::error::$key not found in distributable.yml"; exit 1; }
            echo "$key=$value" | tee -a "$GITHUB_ENV"
          done
          {
            echo "BUNDLE=$RUNNER_TEMP/bundle"
            echo "TOOLS_LIB=$RUNNER_TEMP/tools-lib"
            echo "OUT=$RUNNER_TEMP/evidence"
            echo "RES=$RUNNER_TEMP/result"
          } >> "$GITHUB_ENV"

      - name: R, MOFA2's closure, the bundle's Python (as the smoke lane)
        run: |
          set -o pipefail
          bash packaging/linux/build.sh r
          R_LIBS="$TOOLS_LIB" "/opt/R/$R_VERSION/bin/Rscript" --vanilla .github/mofa-smoke/install-mofa-library.R plan . "$OUT"
          bash packaging/linux/build.sh sysreqs
          R_LIBS="$TOOLS_LIB" "/opt/R/$R_VERSION/bin/Rscript" --vanilla .github/mofa-smoke/install-mofa-library.R install . "$OUT" \
            > "$OUT/install-mofa-library.log" 2>&1 || { tail -n 60 "$OUT/install-mofa-library.log"; exit 1; }
          tail -n 3 "$OUT/install-mofa-library.log"
          bash packaging/linux/build.sh python
          mkdir -p "$BUNDLE/bin"
          install -m 0755 packaging/linux/Rscript "$BUNDLE/bin/Rscript"
          ln -s "/opt/R/$R_VERSION/lib/R" "$BUNDLE/R"

      - name: Train every arm (${{ matrix.scenario }}, seed ${{ matrix.seed }})
        env:
          ARMS: ${{ needs.plan.outputs.arms }}
        run: |
          set -o pipefail
          mkdir -p "$RES"
          cp "$OUT/mofa-library-versions.tsv" "$RES/" || true
          sha256sum .github/mofa-smoke/k151-evidence.R .github/mofa-smoke/k151-score.py | tee "$RES/script-sha256.txt"
          "$BUNDLE/bin/Rscript" --vanilla .github/mofa-smoke/k151-evidence.R "$RES" "${{ matrix.scenario }}" \
            "${{ matrix.seed }}" "$ARMS" 2>&1 | grep -vE '^Iteration [0-9]+:' | tail -n 120

      - name: Nothing token-like in the upload
        if: ${{ !cancelled() }}
        run: |
          if grep -rlE 'ghp_|github_pat_|gho_|Bearer ' "$RES"; then echo "::error::token-like text in the result"; exit 1; fi

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: k151-${{ matrix.scenario }}-${{ matrix.seed }}
          path: ${{ runner.temp }}/result
          retention-days: 30

  score:
    name: Assemble and score
    needs: [plan, evidence]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/mofa-smoke
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: k151-*
          path: ${{ runner.temp }}/jobs
      - name: Score once
        run: |
          sha256sum .github/mofa-smoke/k151-score.py
          python3 -I .github/mofa-smoke/k151-score.py "$RUNNER_TEMP/jobs" .github/mofa-smoke/k151-params.json \
            "$RUNNER_TEMP/score"
          cat "$RUNNER_TEMP/score/score.md" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: score
          path: ${{ runner.temp }}/score
          retention-days: 30
