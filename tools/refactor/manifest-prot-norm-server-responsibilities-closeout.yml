version: 1
wave: prot_norm_server_responsibilities_closeout
source_root: R
collate_mode: explicit

defaults:
  action: extract
  preserve:
    roxygen: true
    comments: true
    whitespace: true

collate_targets:
  - R/mod_prot_norm_workflow_helpers.R
  - R/mod_prot_norm_render_helpers.R
  - R/mod_prot_norm_observer_helpers.R

entries:
  - id: prot_norm_rendering_and_state
    source: R/mod_prot_norm_server_helpers.R
    selector:
      kind: anchor_range
      start: '^renderProtNormQcImage <-'
      end: '^notifyProtNormNormalizationPrereqWarning <-'
      end_inclusive: false
    target: R/mod_prot_norm_render_helpers.R
    group: proteomics.normalization.rendering

  - id: prot_norm_workflows
    source: R/mod_prot_norm_server_helpers.R
    selector:
      kind: anchor_range
      start: '^notifyProtNormNormalizationPrereqWarning <-'
      end: '^registerProtNormServerObservers <-'
      end_inclusive: false
    target: R/mod_prot_norm_workflow_helpers.R
    group: proteomics.normalization.workflows

  - id: prot_norm_observer_and_server_shells
    source: R/mod_prot_norm_server_helpers.R
    selector:
      kind: anchor_range
      start: '^registerProtNormServerObservers <-'
      end: '^runProtNormModuleServerPublicWrapper <-'
      end_inclusive: false
    target: R/mod_prot_norm_observer_helpers.R
    group: proteomics.normalization.observers

  - id: prot_norm_public_wrapper
    source: R/mod_prot_norm_server_helpers.R
    selector:
      kind: symbol
      value: runProtNormModuleServerPublicWrapper
      include_leading_comments: false
    target: R/mod_prot_norm_observer_helpers.R
    group: proteomics.normalization.observers
