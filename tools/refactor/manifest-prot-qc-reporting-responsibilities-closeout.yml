version: 1
wave: prot_qc_reporting_responsibilities_closeout
source_root: R
collate_mode: explicit

defaults:
  action: extract
  preserve:
    roxygen: true
    comments: true
    whitespace: true

collate_targets:
  - R/func_prot_qc_diagnostic_helpers.R
  - R/func_prot_qc_filtering_progress_helpers.R

entries:
  - id: protein_na_percentages
    source: R/func_prot_qc_reporting_helpers.R
    selector: { kind: symbol, value: checkProteinNAPercentages }
    target: R/func_prot_qc_diagnostic_helpers.R
    group: proteomics.qc.diagnostics

  - id: protein_na_recommendations
    source: R/func_prot_qc_reporting_helpers.R
    selector: { kind: symbol, value: getProteinNARecommendations }
    target: R/func_prot_qc_diagnostic_helpers.R
    group: proteomics.qc.diagnostics

  - id: post_imputation_validation
    source: R/func_prot_qc_reporting_helpers.R
    selector: { kind: symbol, value: validatePostImputationProteinData }
    target: R/func_prot_qc_diagnostic_helpers.R
    group: proteomics.qc.diagnostics

  - id: sample_correlation_matrix
    source: R/func_prot_qc_reporting_helpers.R
    selector: { kind: symbol, value: getSamplesCorrelationMatrix }
    target: R/func_prot_qc_diagnostic_helpers.R
    group: proteomics.qc.diagnostics

  - id: protein_filtering_progress
    source: R/func_prot_qc_reporting_helpers.R
    selector: { kind: symbol, value: updateProteinFiltering }
    target: R/func_prot_qc_filtering_progress_helpers.R
    group: proteomics.qc.filtering_progress
