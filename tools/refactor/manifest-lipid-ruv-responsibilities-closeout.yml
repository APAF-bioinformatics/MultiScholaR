version: 1
wave: lipid_ruv_responsibilities_closeout
source_root: R
collate_mode: explicit

defaults:
  action: extract
  preserve:
    roxygen: true
    comments: true
    whitespace: true

collate_targets:
  - R/func_lipid_s4_ruv_control_methods.R
  - R/func_lipid_s4_ruv_methods.R
  - R/func_lipid_norm_ruv_optimization_helpers.R

entries:
  - id: lipid_negative_control_anova
    source: R/func_lipid_norm_ruv_helpers.R
    selector: { kind: setMethod, value: getNegCtrlMetabAnova }
    target: R/func_lipid_s4_ruv_control_methods.R
    group: lipidomics.s4.ruv_controls

  - id: lipid_ruv_cancor
    source: R/func_lipid_norm_ruv_helpers.R
    selector: { kind: setMethod, value: ruvCancor }
    target: R/func_lipid_s4_ruv_methods.R
    group: lipidomics.s4.ruv_methods

  - id: lipid_ruviii_c_varying
    source: R/func_lipid_norm_ruv_helpers.R
    selector: { kind: setMethod, value: ruvIII_C_Varying }
    target: R/func_lipid_s4_ruv_methods.R
    group: lipidomics.s4.ruv_methods

  - id: lipid_per_assay_ruv_optimization
    source: R/func_lipid_norm_ruv_helpers.R
    selector: { kind: symbol, value: runLipidPerAssayRuvOptimization }
    target: R/func_lipid_norm_ruv_optimization_helpers.R
    group: lipidomics.normalization.ruv_optimization

  - id: lipid_best_k_extraction
    source: R/func_lipid_norm_ruv_helpers.R
    selector: { kind: symbol, value: extractLipidBestKPerAssay }
    target: R/func_lipid_norm_ruv_optimization_helpers.R
    group: lipidomics.normalization.ruv_optimization

  - id: lipid_control_extraction
    source: R/func_lipid_norm_ruv_helpers.R
    selector: { kind: symbol, value: extractLipidCtrlPerAssay }
    target: R/func_lipid_norm_ruv_optimization_helpers.R
    group: lipidomics.normalization.ruv_optimization

  - id: lipid_combined_ruv_table
    source: R/func_lipid_norm_ruv_helpers.R
    selector: { kind: symbol, value: buildLipidCombinedRuvTable }
    target: R/func_lipid_norm_ruv_optimization_helpers.R
    group: lipidomics.normalization.ruv_optimization
